# Hardened Docker Compose Configuration for Security
# Implements defense-in-depth security controls

version: '3.8'

services:
  # Application Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.hardened
    image: rag-backend:hardened
    container_name: rag-backend-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # User isolation
    user: "1001:1001"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M

    # Environment with security defaults
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=random
      - TMPDIR=/tmp
      - ENVIRONMENT=production

    # Secrets management
    secrets:
      - db_password
      - jwt_secret
      - encryption_key
      - api_key

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=backend"

    # Network isolation
    networks:
      - frontend
      - backend
      - database

    # Temporary filesystem
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=100m

    # Volume mounts (read-only where possible)
    volumes:
      - ./backend/src:/app/src:ro
      - ./uploads:/app/uploads:rw
      - app_log:/app/log:rw

  # Frontend Application
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: rag-frontend:hardened
    container_name: rag-frontend-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

    # User isolation
    user: "1002:1002"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 50

    # Network isolation (only frontend network)
    networks:
      - frontend

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rag-postgres-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    # User isolation (run as non-root)
    user: "999:999"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 100

    # Environment with security settings
    environment:
      - POSTGRES_DB=${DB_NAME:-ragdb}
      - POSTGRES_USER=${DB_USER:-raguser}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGPASSWORD_FILE=/run/secrets/db_password

    # Secrets
    secrets:
      - db_password

    # Network isolation
    networks:
      - database

    # Volumes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./security/postgres-hardened.conf:/etc/postgresql/postgresql.conf:ro
      - ./security/postgres-pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raguser} -d ${DB_NAME:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Configuration
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c log_statement=all
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rag-redis-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

    # User isolation
    user: "999:999"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50

    # Network isolation
    networks:
      - backend

    # Command with security settings
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --loglevel warning

    # Volumes
    volumes:
      - redis_data:/data

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rag-nginx-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    # User isolation
    user: "101:101"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50

    # Ports
    ports:
      - "80:80"
      - "443:443"

    # Networks
    networks:
      - frontend
      - backend

    # Volumes
    volumes:
      - ./security/nginx-hardened.conf:/etc/nginx/nginx.conf:ro
      - ./security/ssl:/etc/nginx/ssl:ro
      - nginx_log:/var/log/nginx

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Security Scanning Service (ClamAV)
  clamav:
    image: clamav/clamav:alpine
    container_name: rag-clamav-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 100

    # Networks
    networks:
      - backend

    # Volumes
    volumes:
      - clamav_data:/var/lib/clamav
      - ./security/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./uploads:/scan:ro

    # Health check
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Security Monitoring (Fail2Ban)
  fail2ban:
    build:
      context: ./security/fail2ban
    container_name: rag-fail2ban-hardened
    restart: unless-stopped

    # Security context
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    # Networks
    networks:
      - frontend
      - backend

    # Volumes
    volumes:
      - ./security/fail2ban.conf:/etc/fail2ban/jail.local:ro
      - nginx_log:/var/log/nginx:ro
      - app_log:/var/log/app:ro

    # Environment
    environment:
      - TZ=UTC

# Secrets configuration
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  api_key:
    file: ./secrets/api_key.txt

# Networks with isolation
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    internal: true  # No internet access
    ipam:
      config:
        - subnet: 172.21.0.0/24
  database:
    driver: bridge
    internal: true  # No internet access
    ipam:
      config:
        - subnet: 172.22.0.0/24

# Volumes
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  clamav_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/clamav
  app_log:
    driver: local
  nginx_log:
    driver: local
