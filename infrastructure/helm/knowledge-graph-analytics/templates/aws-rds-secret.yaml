{{- if .Values.awsRdsSecret.enabled }}
{{- $cfg := .Values.awsRdsSecret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-rds-secret-reader
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "awsRdsSecret.roleArn is required" $cfg.roleArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-rds-secretsmanager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: aws-rds-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-database-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-rds-secretsmanager
    kind: SecretStore
  target:
    name: aws-database-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://{{ "{{ .username | urlquery }}" }}:{{ "{{ .password | urlquery }}" }}@{{ required "awsRdsSecret.host is required" $cfg.host }}:5432/{{ required "awsRdsSecret.database is required" $cfg.database }}?sslmode=require'
        POSTGRES_HOST: {{ $cfg.host | quote }}
        POSTGRES_PORT: "5432"
        POSTGRES_DB: {{ $cfg.database | quote }}
        POSTGRES_USER: '{{ "{{ .username }}" }}'
        POSTGRES_PASSWORD: '{{ "{{ .password }}" }}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "awsRdsSecret.secretArn is required" $cfg.secretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $cfg.secretArn | quote }}
        property: password
{{- end }}
