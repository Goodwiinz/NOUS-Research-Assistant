{{- if .Values.celeryWorker.enabled }}
{{- $workerImageTag := .Values.backend.image.tag | default .Chart.AppVersion }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-worker
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      {{- if .Values.backend.image.sourceSha }}
      annotations:
        {{- include "knowledge-graph-analytics.backendSourceAnnotation" . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "knowledge-graph-analytics.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: celery-worker
          image: {{ include "knowledge-graph-analytics.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - celery
            - -A
            - src.tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - --prefetch-multiplier=1
            - --max-tasks-per-child=100
            - --max-memory-per-child=900000
            - -Q
            # agent_runs: AGENT_DISPATCH_BACKEND=celery turns (audit P1.3).
            # Consuming the (empty) queue while the flag is "background" is
            # free; without it here a values-level flag flip would enqueue
            # turns nobody consumes.
            - celery,document_processing,high_priority,low_priority,entity_processing,graph_processing,agent_runs,text_processing,vector_processing
          envFrom:
            {{- if .Values.backend.envFrom }}
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
            {{- end }}
          # Shared backend.env merged with per-component overrides (e.g. a
          # smaller DB pool budget than the request-serving backend) into a
          # UNIQUE-by-name list, component value winning. A plain append would
          # emit duplicate env names, which the kubelet tolerates (last wins)
          # but ArgoCD's strategic-merge-patch rejects (env list is keyed by
          # `name`) — breaking sync for the whole app. See mergedEnv helper.
          env:
            {{- $workerBaseEnv := list }}
            {{- range .Values.backend.env }}
            {{- if ne .name "IMAGE_TAG" }}
            {{- $workerBaseEnv = append $workerBaseEnv . }}
            {{- end }}
            {{- end }}
            {{- $workerOverrideEnv := list }}
            {{- range .Values.celeryWorker.env }}
            {{- if ne .name "IMAGE_TAG" }}
            {{- $workerOverrideEnv = append $workerOverrideEnv . }}
            {{- end }}
            {{- end }}
            {{- include "knowledge-graph-analytics.mergedEnv" (dict "base" $workerBaseEnv "override" $workerOverrideEnv) | nindent 12 }}
            - name: IMAGE_TAG
              value: {{ $workerImageTag | quote }}
          resources:
            {{- if .Values.celeryWorker.resources }}
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
            {{- end }}
          # Targets the local worker only (-d celery@$HOSTNAME) instead of broadcasting to the
          # whole cluster — avoids false kills under CPU pressure when the control-plane
          # round-trip exceeds the probe timeout.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A src.tasks.celery_app inspect ping -d celery@$HOSTNAME --timeout={{ .Values.celeryWorker.livenessProbe.commandTimeout | default 60 }}
            initialDelaySeconds: {{ .Values.celeryWorker.livenessProbe.initialDelaySeconds | default 60 }}
            periodSeconds: {{ .Values.celeryWorker.livenessProbe.periodSeconds | default 180 }}
            timeoutSeconds: {{ .Values.celeryWorker.livenessProbe.timeoutSeconds | default 90 }}
            failureThreshold: {{ .Values.celeryWorker.livenessProbe.failureThreshold | default 10 }}
{{- end }}
