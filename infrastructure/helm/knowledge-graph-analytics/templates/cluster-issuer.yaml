{{- /* Let's Encrypt only makes sense on the nginx ingress path. On EKS the
ingress class is alb and TLS terminates on an AWS ACM cert (values-aws), and
cert-manager is not installed there — rendering a ClusterIssuer would make the
whole ArgoCD sync fail on the missing cert-manager.io GVK. */ -}}
{{- if and .Values.global.dnsZone (ne .Values.ingress.className "alb") }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: allocs16@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}
