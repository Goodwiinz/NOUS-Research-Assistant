{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-backend
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.backend.service.targetPort }}"
        prometheus.io/path: "/metrics"
        {{- include "knowledge-graph-analytics.backendSourceAnnotation" . | nindent 8 }}
      labels:
        {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "knowledge-graph-analytics.serviceAccountName" . }}
      # Drain window for long-lived WebSocket connections. preStop (below) lets
      # the Service/ingress deregister this pod before SIGTERM; the app's
      # lifespan shutdown then closes remaining sockets with code 1001. Must
      # exceed the preStop sleep plus the socket-close time.
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" 2>/dev/null; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 3
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          envFrom:
            - secretRef:
                name: {{ .Values.backend.postgresSecretName | default "database-credentials" }}
        {{- if .Values.backend.initContainers.runMigrations }}
        - name: run-migrations
          image: {{ include "knowledge-graph-analytics.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          workingDir: /app
          command:
            - sh
            - -c
            - |
              set -e
              echo "[init] Running alembic upgrade heads..."
              alembic upgrade heads
              echo "[init] Migrations complete."
          envFrom:
            {{- if .Values.backend.envFrom }}
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.backend.env }}
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        {{- end }}
      containers:
        - name: backend
          image: {{ include "knowledge-graph-analytics.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          {{- if .Values.backend.healthCheck.enabled }}
          # Probe paths are split by purpose:
          #  * liveness + startup -> process-alive path (backend.healthCheck.path,
          #    default /health). MUST NOT gate on external deps or a slow/unhealthy
          #    dependency would restart / block-start otherwise-fine pods.
          #  * readiness -> dependency-aware path (backend.healthCheck.readinessPath,
          #    default /health/readiness) so a pod that loses a critical dependency
          #    is pulled from the Service without being killed.
          # Startup probe: generous time for ML model loading
          startupProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.startupPath | default .Values.backend.healthCheck.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.backend.healthCheck.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.backend.healthCheck.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.backend.healthCheck.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.backend.healthCheck.startupProbe.failureThreshold | default 18 }}
          # Liveness: is the process alive? (process-alive path only)
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.livenessPath | default .Values.backend.healthCheck.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.backend.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.healthCheck.failureThreshold }}
          # Readiness: can it serve traffic? (dependency-aware path)
          # SAFETY: readiness gates the load balancer, so a strict/flappy check
          # can pull EVERY pod out of the Service at once -> total outage. The
          # thresholds below are clamped to safe floors (periodSeconds >= 10,
          # failureThreshold >= 3) so a values override can't accidentally cross
          # them, and the timeout is generous because the check does a (cached)
          # DB + Redis round-trip.
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.readinessPath | default "/health/readiness" }}
              port: http
            initialDelaySeconds: {{ .Values.backend.healthCheck.readinessInitialDelaySeconds | default 5 }}
            periodSeconds: {{ max (.Values.backend.healthCheck.readinessPeriodSeconds | default 10 | int) 10 }}
            timeoutSeconds: {{ .Values.backend.healthCheck.readinessTimeoutSeconds | default 5 }}
            failureThreshold: {{ max (.Values.backend.healthCheck.readinessFailureThreshold | default 3 | int) 3 }}
          {{- end }}
          # preStop delay: on termination the pod is removed from Service
          # endpoints; this sleep gives the ingress time to stop routing NEW
          # connections here before SIGTERM triggers the graceful socket close,
          # so in-flight WebSocket clients drain instead of being cut mid-frame.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep {{ .Values.backend.terminationDrainSeconds | default 15 }}"
          envFrom:
            {{- if .Values.backend.envFrom }}
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
            {{- end }}
          env:
            {{- $backendEnv := list }}
            {{- range .Values.backend.env }}
            {{- if ne .name "IMAGE_TAG" }}
            {{- $backendEnv = append $backendEnv . }}
            {{- end }}
            {{- end }}
            {{- with $backendEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: IMAGE_TAG
              value: {{ .Values.backend.image.tag | default .Chart.AppVersion | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
            - name: models
              mountPath: /app/models
      volumes:
        - name: uploads
          emptyDir:
            sizeLimit: 5Gi
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: models
          emptyDir:
            sizeLimit: 2Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
