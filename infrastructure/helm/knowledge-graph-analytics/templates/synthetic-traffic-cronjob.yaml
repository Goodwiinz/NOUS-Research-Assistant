{{- if .Values.syntheticTraffic.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  # NOT the {{`{{ .fullname }}`}} prefix used elsewhere: CronJob names must stay
  # short. K8s appends "-<8-digit-minute-stamp>" for the Job and "-<5-char>" for
  # the Pod, and the Job name is used as the `job-name` label value (max 63).
  # The full "nous-dev-knowledge-graph-analytics-synthetic-traffic" (52) already
  # forced pod-name truncation and left zero headroom before Jobs would fail to
  # create. Base on the release name only. trunc 52 = the CronJob-name ceiling.
  name: {{ printf "%s-synthetic-traffic" .Release.Name | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: synthetic-traffic
spec:
  schedule: {{ .Values.syntheticTraffic.schedule | quote }}
  suspend: {{ .Values.syntheticTraffic.suspend | default false }}
  # Forbid overlapping runs: if the previous job is still running when the
  # next tick fires, skip that tick rather than stacking a second pod.
  concurrencyPolicy: Forbid
  # Retain enough completed runs to cover a full scenario rotation. With one
  # scenario per 20-min fire, the 7-scenario rotation takes ~2.3h to cycle; a
  # history of 2 GC'd the heavy runs (arxiv / kg / ingest) before their traces
  # could be inspected. 8 keeps at least one full rotation on hand.
  successfulJobsHistoryLimit: {{ .Values.syntheticTraffic.successfulJobsHistoryLimit | default 8 }}
  failedJobsHistoryLimit: {{ .Values.syntheticTraffic.failedJobsHistoryLimit | default 4 }}
  # If the CronJob controller misses a fire (e.g. cluster restart), only
  # attempt a catch-up run if we missed by less than 2 minutes.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      # Never retry: a retry re-runs the WHOLE sweep at full LLM cost for a
      # window whose traces were already partly emitted, and the CronJob fires
      # again in 20 min anyway. Prefer a clean failure over double spend.
      backoffLimit: 0
      # Hard ceiling. Must exceed the sweep the configured args actually run:
      # SCENARIO_TIMEOUT_S (360 s) is per scenario, so `--all` over the 7
      # scenarios needs ~2520 s plus graph-build startup. 600 s killed those
      # mid-flight (audit R5-L20). Default covers `--all`; values-dev.yaml
      # runs `--rotate` and tightens this back down.
      activeDeadlineSeconds: {{ .Values.syntheticTraffic.activeDeadlineSeconds | default 2700 }}
      template:
        metadata:
          {{- if .Values.backend.image.sourceSha }}
          annotations:
            {{- include "knowledge-graph-analytics.backendSourceAnnotation" . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: synthetic-traffic
        spec:
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "knowledge-graph-analytics.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: synthetic-traffic
              image: {{ include "knowledge-graph-analytics.backendImage" . | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              workingDir: /app
              command: ["python", "-m", "scripts.synthetic_traffic"]
              args: {{ .Values.syntheticTraffic.args | default (list "--rotate") | toJson }}
              envFrom:
                {{- if .Values.backend.envFrom }}
                {{- toYaml .Values.backend.envFrom | nindent 16 }}
                {{- end }}
              env:
                {{- include "knowledge-graph-analytics.mergedEnv" (dict "base" .Values.backend.env "override" .Values.syntheticTraffic.env) | nindent 16 }}
                # Ensure PYTHONPATH and ENVIRONMENT are always set even if
                # backend.env is overridden in a future values file.
                - name: ENVIRONMENT
                  value: {{ .Values.global.environment | default "dev" | quote }}
                - name: PYTHONPATH
                  value: "/app"
              # The job loads the full LangGraph agent (model clients, tool
              # registry, embeddings) once per run — the same stack the backend
              # serving pod runs. 512Mi OOM-killed every fire; size the floor to
              # the agent's real footprint. Overridable via values for tuning.
              resources:
                {{- with .Values.syntheticTraffic.resources }}
                {{- toYaml . | nindent 16 }}
                {{- else }}
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 1536Mi
                {{- end }}
{{- end }}
