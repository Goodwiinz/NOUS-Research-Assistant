{{- if .Values.celeryBeat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-beat
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  replicas: {{ .Values.celeryBeat.replicaCount | int }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      {{- if .Values.backend.image.sourceSha }}
      annotations:
        {{- include "knowledge-graph-analytics.backendSourceAnnotation" . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "knowledge-graph-analytics.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: celery-beat
          image: {{ include "knowledge-graph-analytics.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - celery
            - -A
            - src.tasks.celery_app
            - beat
            - --loglevel=info
          envFrom:
            {{- if .Values.backend.envFrom }}
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
            {{- end }}
          # Shared backend.env merged with per-component overrides (e.g. a
          # smaller DB pool budget than the request-serving backend) into a
          # UNIQUE-by-name list, component value winning. A plain append would
          # emit duplicate env names, which the kubelet tolerates (last wins)
          # but ArgoCD's strategic-merge-patch rejects (env list is keyed by
          # `name`) — breaking sync for the whole app. See mergedEnv helper.
          env:
            {{- include "knowledge-graph-analytics.mergedEnv" (dict "base" .Values.backend.env "override" .Values.celeryBeat.env) | nindent 12 }}
          resources:
            {{- if .Values.celeryBeat.resources }}
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
            {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'celery.*beat' > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
{{- end }}
