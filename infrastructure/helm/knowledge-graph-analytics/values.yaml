# Default values for Knowledge Graph Analytics Dashboard

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "gp2"
  dnsZone: "yourdomain.com"
  environment: "production"

# Common labels and annotations
commonLabels:
  app.kubernetes.io/name: knowledge-graph-analytics
  app.kubernetes.io/instance: knowledge-graph-analytics
  app.kubernetes.io/managed-by: Helm

commonAnnotations: {}

# ──────────────────────────────────────────────
# Infisical secret sync (cloud)
# ──────────────────────────────────────────────
# Off by default; enable per env via values-{env}.yaml. Each entry under
# `secrets` produces one InfisicalSecret CRD; the operator materializes a
# native K8s Secret with the same name the backend already references via
# envFrom in *-deployment.yaml.
infisical:
  enabled: false
  hostAPI: "https://app.infisical.com/api"
  resyncInterval: 60
  # Auto-generated by Infisical; look up via API: GET /api/v1/workspace/<id>
  projectSlug: "nous-platform-pl-3-o"
  envSlug: ""  # MUST be set per env: "dev", "staging", "prod"
  credentialsRef:
    name: "infisical-universal-auth"
    namespace: ""  # defaults to release namespace
  # secretName (in cluster) → folder path (in Infisical)
  secrets:
    database-credentials: "/database"
    app-secrets: "/app"
    spaces-credentials: "/spaces"
    supabase-credentials: "/supabase"
    redis-credentials: "/redis"
    azure-openai-credentials: "/azure-openai"
    langsmith-credentials: "/langsmith"
    do-kb-credentials: "/do-kb"

# Optional AWS Secrets Manager sync for the RDS candidate. The DO rollback
# credential remains in the separate Infisical-managed database-credentials.
awsRdsSecret:
  enabled: false
  roleArn: ""
  secretArn: ""
  host: ""
  database: ""

# Frontend is deployed externally via Vercel — no in-cluster manifests.

# Backend Configuration
backend:
  enabled: true
  replicaCount: 3

  # Graceful drain for long-lived WebSocket connections (see backend-deployment.yaml).
  # terminationGracePeriodSeconds must exceed terminationDrainSeconds + socket close.
  terminationDrainSeconds: 15
  terminationGracePeriodSeconds: 45

  image:
    repository: your-registry/knowledge-graph-backend
    tag: "1.0.0"
    # When set, every backend runtime renders repository@digest. The tag stays
    # available as release/source metadata (IMAGE_TAG) but is not used for the
    # pull reference.
    digest: ""
    # Full tested Git SHA written by the release workflow and copied to pod
    # annotations for source-to-runtime traceability.
    sourceSha: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    hosts:
      - host: api.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: backend-tls
        hosts:
          - api.yourdomain.com

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    - name: ENVIRONMENT
      value: "production"
    # Evidence-independent Luna lane. Disabled unless an environment opts in;
    # rollback is a values-only flip to "false".
    - name: AGENT_FAST_PATH_ENABLED
      value: "false"
    - name: AGENT_FAST_PATH_DEPLOYMENT
      value: "gpt-5.6-luna"
    - name: LOG_LEVEL
      value: "INFO"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: database-credentials
          key: url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: redis-credentials
          key: url
    - name: NEO4J_URI
      value: "bolt://neo4j:7687"
    - name: NEO4J_USER
      valueFrom:
        secretKeyRef:
          name: neo4j-credentials
          key: username
    - name: NEO4J_PASSWORD
      valueFrom:
        secretKeyRef:
          name: neo4j-credentials
          key: password
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: backend-secrets
          key: secret-key
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: ai-credentials
          key: openai-key
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: ai-credentials
          key: anthropic-key

  healthCheck:
    enabled: true
    # path        -> liveness + startup (process-alive /health handler)
    # readinessPath -> readiness (dependency-aware /health/readiness handler)
    # Split so a dependency outage removes a pod from the LB (readiness)
    # without restarting it (liveness). Readiness timing has safe floors
    # enforced in the template (periodSeconds >= 10, failureThreshold >= 3).
    path: /health
    livenessPath: /health
    startupPath: /health
    readinessPath: /health/readiness
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    readinessInitialDelaySeconds: 5
    readinessPeriodSeconds: 10
    readinessTimeoutSeconds: 5
    readinessFailureThreshold: 3

# Celery Worker Configuration
celeryWorker:
  enabled: true
  replicaCount: 2

  image:
    repository: your-registry/knowledge-graph-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  command: ["celery", "-A", "src.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  env:
    - name: ENVIRONMENT
      value: "production"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: database-credentials
          key: url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: redis-credentials
          key: url
    - name: NEO4J_URI
      value: "bolt://neo4j:7687"
    - name: NEO4J_USER
      valueFrom:
        secretKeyRef:
          name: neo4j-credentials
          key: username
    - name: NEO4J_PASSWORD
      valueFrom:
        secretKeyRef:
          name: neo4j-credentials
          key: password

# Celery Beat Configuration
celeryBeat:
  enabled: true
  replicaCount: 1

  image:
    repository: your-registry/knowledge-graph-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  command: ["celery", "-A", "src.tasks.celery_app", "beat", "--loglevel=info"]

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  env:
    - name: ENVIRONMENT
      value: "production"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: database-credentials
          key: url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: redis-credentials
          key: url

# PostgreSQL Configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    database: ragdb
    username: raguser
    existingSecret: "postgresql-credentials"
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp2"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    initdb:
      scripts:
        init.sql: |
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "btree_gin";

# Redis Configuration
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: "redis-credentials"
    existingSecretPasswordKey: "password"
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp2"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp2"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Neo4j Configuration
neo4j:
  enabled: true
  auth:
    enabled: true
    existingSecret: "neo4j-credentials"
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistence:
    enabled: true
    size: 200Gi
    storageClass: "gp2"
  config:
    dbms:
      memory:
        heap:
          initial_size: "1G"
          max_size: "2G"
        pagecache:
          size: "1G"
      security:
        procedures:
          unrestricted: "apoc.*,gds.*"
      plugins:
        - apoc
        - graph-data-science

# Prometheus Configuration
prometheus:
  enabled: true
  server:
    retention: "15d"
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: "gp2"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    config:
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - "/etc/prometheus/rules/*.yml"
      scrape_configs:
        - job_name: 'backend'
          static_configs:
            - targets: ['backend:8000']
          metrics_path: /metrics
        - job_name: 'postgresql'
          static_configs:
            - targets: ['postgresql-exporter:9187']
        - job_name: 'redis'
          static_configs:
            - targets: ['redis-exporter:9121']
        - job_name: 'neo4j'
          static_configs:
            - targets: ['neo4j:2004']

# Grafana Configuration
grafana:
  enabled: true
  adminPassword: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "gp2"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
    dashboards:
      enabled: true
      provider:
        allowUiUpdates: false

# NGINX Ingress Controller
nginx-ingress-controller:
  enabled: true
  controller:
    replicaCount: 2
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    service:
      type: LoadBalancer
      loadBalancerIP: ""
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    config:
      use-proxy-protocol: "true"
      proxy-buffer-size: "16k"
      proxy-buffers-number: "4"

# Storage Classes
storageClasses:
  - name: gp2
    provisioner: kubernetes.io/aws-ebs
    parameters:
      type: gp2
      fsType: ext4
    reclaimPolicy: Retain
    allowVolumeExpansion: true

# Monitoring and Logging
monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: "15d"
  grafana:
    enabled: true
    persistence:
      enabled: true
      size: "10Gi"
  loki:
    enabled: true
    persistence:
      enabled: true
      size: "20Gi"
  fluentd:
    enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# Pod Security Policy
podSecurityPolicy:
  enabled: true
  spec:
    privileged: false
    allowPrivilegeEscalation: false
    requiredDropCapabilities:
      - ALL
    volumes:
      - 'configMap'
      - 'emptyDir'
      - 'projected'
      - 'secret'
      - 'downwardAPI'
      - 'persistentVolumeClaim'

# Network Policies
# Rendered by templates/networkpolicy.yaml. The policy targets the BACKEND pods
# only (component=backend) — Neo4j/celery share selectorLabels, so a broader
# selector would wrongly default-deny their ingress. `ingress`/`egress.enabled`
# gate the two rule sets independently; egress lockdown is opt-in because the
# external managed deps (Supabase / DO Redis / DO Spaces / Azure OpenAI) make it
# the risky half.
networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true
  # Namespace of the shared, cluster-level ingress-nginx controller allowed to
  # reach the backend. Override per-env if the controller lives elsewhere; set
  # empty to drop the allow.
  ingressControllerNamespace: ingress-nginx
  # Namespace where Prometheus runs and scrapes the backend /metrics endpoint
  # (same port as the app). Set empty to drop the allow.
  monitoringNamespace: monitoring

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Affinity and Anti-Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - knowledge-graph-analytics
          topologyKey: kubernetes.io/hostname

# Tolerations and Node Selectors
tolerations: []
nodeSelector: {}

# Pod Annotations
podAnnotations: {}

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# Note: no Neo4j backup/DR automation ships with this chart. The knowledge
# graph is derived data — DR is a rebuild via scripts/repair_kg.py, and PVC
# loss is accepted on dev. See docs/decisions/neo4j-dr.md. Revisit before
# production promotion.

# Synthetic traffic generator — drives the compiled LangGraph agent in-process
# to produce continuous LangSmith traces. Disabled by default; enabled only in
# dev via values-dev.yaml.
syntheticTraffic:
  enabled: false
  schedule: "*/20 * * * *"
  args: ["--rotate"]
  # Synthetic runs exercise the agent with the dedicated Luna deployment,
  # without changing the model used by the serving backend.
  env:
    - name: LANGCHAIN_CALLBACKS_BACKGROUND
      value: "false"
    - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
      value: "gpt-5.6-luna"
    - name: AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT
      value: "gpt-5.6-luna"
    - name: AZURE_OPENAI_SYNTHESIS_DEPLOYMENT
      value: "gpt-5.6-luna"
    - name: AGENT_MAIN_REASONING_EFFORT
      value: "none"
    - name: AGENT_LIGHTWEIGHT_REASONING_EFFORT
      value: "none"

# ──────────────────────────────────────────────
# KEDA queue-depth autoscaling for the celery-worker (audit P1.6 / finding X5)
# ──────────────────────────────────────────────
# SCAFFOLD, OFF by default. Renders templates/keda-scaledobject.yaml (a KEDA
# ScaledObject + TriggerAuthentication) ONLY when enabled: true. Requires the
# KEDA operator to be installed in the cluster first — see
# docs/decisions/worker-autoscaling.md for the rationale (KEDA over
# prometheus-adapter) and the full install/rollback checklist.
#
# When enabled=true the plain CPU/memory worker HPA (templates/hpa.yaml) is
# suppressed (mutual exclusion) because KEDA reconciles its own HPA.
keda:
  enabled: false
  # min/max mirror the plain worker HPA it replaces. Kept modest on purpose:
  # queue-depth scaling reacts to backlog, not resource pressure.
  minReplicaCount: 1
  maxReplicaCount: 3
  # How often KEDA polls the Redis list length (seconds).
  pollingInterval: 30
  # Seconds of empty-queue before scaling back toward minReplicaCount.
  cooldownPeriod: 300
  # HPA scale-down stabilization; matches the conservative window of the plain
  # worker HPA so long-running indexing/LLM tasks aren't interrupted.
  scaleDownStabilizationSeconds: 600
  redis:
    # host:port of the DO Managed Valkey (Redis-protocol) endpoint. NON-SECRET,
    # so it is inlined into the ScaledObject trigger metadata as `address`
    # (KEDA's redis scaler accepts host:port via the `address` param) rather
    # than pulled from a secret. Set the real endpoint in values-<env>.yaml.
    address: ""
    # ACL username, NON-SECRET, also inlined into trigger metadata. DO Managed
    # Valkey ships with the "default" user; leave empty to omit the param.
    username: ""
    # The ONLY secret KEDA needs: the Valkey password. Referenced as a single
    # `password` secretTargetRef from the existing app secret — host/port/user
    # above are values, NOT secret keys. Ensure passwordKey exists in
    # authSecretName (Infisical-synced) before flipping enabled: true.
    authSecretName: redis-credentials
    passwordKey: REDIS_PASSWORD
    # DO Managed Valkey uses rediss:// (TLS). "true" → KEDA enableTLS.
    enableTLS: "true"
    databaseIndex: "0"
  # One redis-list trigger per queue that matters. KEDA scales on the MAX
  # desired replicas across triggers, so a backlog on either queue scales up.
  # listLength is the target items-per-replica (~10). Kept to the two hottest
  # queues (celery default + document_processing) — add high_priority /
  # agent_runs here if they develop their own backlog.
  triggers:
    - queue: celery
      listLength: "10"
    - queue: document_processing
      listLength: "10"
