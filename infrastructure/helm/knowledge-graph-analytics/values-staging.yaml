# Staging values for NOUS Platform
# Auto-deployed by ArgoCD when develop branch changes
# Cluster: do-nyc3-rag-system-cluster
# Namespace: rag-staging

global:
  imageRegistry: "registry.digitalocean.com/ragsystemregistry"
  imagePullSecrets:
    - name: do-registry
  environment: "staging"
commonLabels:
  app.kubernetes.io/name: knowledge-graph-analytics
  app.kubernetes.io/part-of: nous-platform
  environment: staging
# ──────────────────────────────────────────────
# Frontend deployed via Vercel — no in-cluster manifests.
# Host: staging-app.goodwiinz.tech (DNS points at Vercel).
# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.digitalocean.com/ragsystemregistry/backend
    tag: "8ec52eb"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    hosts:
      - host: staging-api.goodwiinz.tech
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: rag-staging-api-tls
        hosts:
          - staging-api.goodwiinz.tech
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: false
  envFrom:
    - secretRef:
        name: database-credentials
    - secretRef:
        name: app-secrets
    - secretRef:
        name: supabase-credentials
    - secretRef:
        name: spaces-credentials
    # Optional: LangSmith tracing (LANGSMITH_API_KEY, LANGSMITH_PROJECT, ...).
    # Marked optional so the pod still starts if the secret is absent.
    - secretRef:
        name: langsmith-credentials
        optional: true
    # DigitalOcean Knowledge Base credentials. Optional so pod boots before
    # /do-kb folder is populated in Infisical.
    - secretRef:
        name: do-kb-credentials
        optional: true
  env:
    - name: ENVIRONMENT
      value: "staging"
    - name: PYTHONPATH
      value: "/app"
    - name: LOG_LEVEL
      value: "DEBUG"
    - name: WORKERS
      value: "2"
    - name: TIMEOUT
      value: "300"
    - name: CORS_ORIGINS
      value: "https://staging-app.goodwiinz.tech"
    # CORS_ORIGIN_REGEX: defined in Infisical `/app` (env=staging) → synced
    # into `app-secrets` Secret, exposed via envFrom above. Set the regex
    # there to the project-specific Vercel slug. Empty disables.
    # Database pool sizing: tuned for Supabase session-mode pooler limits.
    - name: DB_ASYNC_POOL_SIZE
      value: "3"
    - name: DB_ASYNC_MAX_OVERFLOW
      value: "2"
    - name: DB_SYNC_POOL_SIZE
      value: "1"
    - name: DB_SYNC_MAX_OVERFLOW
      value: "1"
    # Sentry: SENTRY_DSN comes from the `app-secrets` external secret via envFrom.
    - name: SENTRY_ENVIRONMENT
      value: "staging"
    # stable LangSmith project; do NOT suffix per-session
    - name: LANGSMITH_PROJECT
      value: "rag-agent-staging"
    - name: LANGCHAIN_PROJECT
      value: "rag-agent-staging"
    - name: SENTRY_TRACES_SAMPLE_RATE
      value: "0.5"
    - name: SENTRY_PROFILES_SAMPLE_RATE
      value: "0.0"
    # S3-Compatible Object Storage (DigitalOcean Spaces)
    - name: STORAGE_BACKEND
      value: "s3"
    - name: S3_ENDPOINT_URL
      value: "https://nyc3.digitaloceanspaces.com"
    - name: S3_BUCKET_NAME
      value: "rag-system-storage"
    - name: S3_REGION
      value: "nyc3"
    - name: S3_CDN_ENDPOINT
      value: "https://rag-system-storage.nyc3.cdn.digitaloceanspaces.com"
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: spaces-credentials
          key: S3_ACCESS_KEY
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: spaces-credentials
          key: S3_SECRET_KEY
    # Azure OpenAI (Chat / Agent)
    - name: AZURE_OPENAI_CHAT_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_ENDPOINT
    - name: AZURE_OPENAI_CHAT_API_KEY
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_API_KEY
    - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
    - name: AZURE_OPENAI_CHAT_API_VERSION
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_API_VERSION
  healthCheck:
    enabled: true
    # Process-alive path for liveness + startup.
    path: /health
    livenessPath: /health
    startupPath: /health
    # Dependency-aware path for readiness (Postgres + Redis, cached ~5s).
    readinessPath: /health/readiness
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 18
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    # Slack readiness floors (see template): a flappy readiness check pulls
    # every pod from the LB at once.
    readinessInitialDelaySeconds: 5
    readinessPeriodSeconds: 10
    readinessTimeoutSeconds: 5
    readinessFailureThreshold: 3
  initContainers:
    waitForPostgres: true
    waitForRedis: false
    waitForNeo4j: false
    runMigrations: true
# ──────────────────────────────────────────────
# All databases are external (DO Managed)
# ──────────────────────────────────────────────
postgresql:
  enabled: false
redis:
  enabled: false
neo4j:
  enabled: false
celeryWorker:
  enabled: false
celeryBeat:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
nginx-ingress-controller:
  enabled: false
monitoring:
  enabled: false
# ──────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
podSecurityPolicy:
  enabled: false
networkPolicy:
  enabled: false
podDisruptionBudget:
  enabled: false
serviceAccount:
  create: true
  annotations: {}
  name: ""
# Synthetic traffic is dev-only; disabled in staging and production.
syntheticTraffic:
  enabled: false
