# Dev values for NOUS Platform
# Auto-deployed by ArgoCD when develop branch changes
# Cluster: do-nyc3-rag-system-cluster
# Namespace: rag-dev

global:
  imageRegistry: "registry.digitalocean.com/ragsystemregistry"
  imagePullSecrets:
    - name: do-registry
  environment: "dev"
  storageClass: "do-block-storage"
commonLabels:
  app.kubernetes.io/name: knowledge-graph-analytics
  app.kubernetes.io/part-of: nous-platform
  environment: dev
# ──────────────────────────────────────────────
# Infisical secret sync — dev env
# ──────────────────────────────────────────────
infisical:
  enabled: true
  envSlug: "dev"
# ──────────────────────────────────────────────
# Frontend deployed via Vercel — no in-cluster manifests.
# Host: dev-app.gen-text.app (DNS points at Vercel).
# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.digitalocean.com/ragsystemregistry/backend
    tag: "bbce8ddfbd66ac291776d28bc462ad444196f675"
    # The digest is the actual pull identity; tag/sourceSha are trace metadata.
    digest: "sha256:0255dbb82a0a67c074e004d76f36f9486d597f201564d34a5435caa93a3e11cb"
    sourceSha: "bbce8ddfbd66ac291776d28bc462ad444196f675"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    hosts:
      - host: dev-api.gen-text.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: rag-dev-api-tls
        hosts:
          - dev-api.gen-text.app
  resources:
    limits:
      # 1 CPU throttled the single-worker loop during agent synthesis + arXiv
      # ingest bursts: trivial SELECTs stretched to ~2.7s, /health past the 5s
      # probe timeout, and kubelet SIGKILLed a healthy pod mid-SSE (2026-08-18,
      # 3 restarts). 2 gives burst headroom; requests unchanged so scheduling
      # and node memory pressure are unaffected.
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      # Bumped from 512Mi: real RSS reached ~1.3Gi under the former two-fork
      # image. One worker now avoids duplicating the graph/model, while this
      # request keeps headroom against kubelet eviction (exit 137).
      memory: 1500Mi
  autoscaling:
    enabled: false
  envFrom:
    - secretRef:
        name: database-credentials
    - secretRef:
        name: app-secrets
    - secretRef:
        name: spaces-credentials
    - secretRef:
        name: supabase-credentials
    - secretRef:
        name: redis-credentials
    # Optional: LangSmith tracing (LANGSMITH_API_KEY, LANGSMITH_PROJECT, ...).
    # Marked optional so the pod still starts if the secret is absent.
    - secretRef:
        name: langsmith-credentials
        optional: true
    # DigitalOcean Knowledge Base (DO_API_TOKEN, DO_KB_REGION, ...). Optional
    # so the pod still starts before the /do-kb folder is populated.
    - secretRef:
        name: do-kb-credentials
        optional: true
  env:
    - name: ENVIRONMENT
      value: "dev"
    # Luna direct lane for evidence-independent turns. One-command rollback:
    # set this value to "false" and re-apply/sync the dev values.
    - name: AGENT_FAST_PATH_ENABLED
      value: "true"
    - name: AGENT_FAST_PATH_DEPLOYMENT
      value: "gpt-5.6-luna"
    - name: AGENT_DOKB_COHERE_RERANK
      value: "true"
    # One process per pod avoids duplicating the model/tool graph in the 2Gi
    # container. Rollback: raise this value without rebuilding the image.
    - name: GUNICORN_WORKERS
      value: "1"
    # Durable agent state (audit X3): ENVIRONMENT=dev is a SHARED deployed
    # environment, so the LangGraph checkpointer/memory store hard-fail on
    # Postgres init failure instead of silently degrading to in-memory
    # state (which breaks HITL resume + cross-restart memory invisibly).
    # "false" here is the code default, stated explicitly as the rollback
    # lever: flip to "true" (values-only change, no image rebuild) to
    # temporarily tolerate a broken Postgres, and revert after the outage.
    - name: ALLOW_MEMORY_FALLBACK
      value: "false"
    # Satellite reconciler (audit D1): RECONCILER_ENABLED=true is the code
    # default (report-only). APPLY=true arms actual re-drives of failed
    # Neo4j/DO-KB syncs (rate-capped, org-scoped, idempotent cores from
    # repair_kg/backfill_do_kb). Verified report-only output on dev first
    # (2026-07-12: eligible=0 — arms forward-repair for new failures only;
    # historical NULL-status docs are untouched by design). Rollback: flip
    # to "false", values-only, no image rebuild.
    - name: RECONCILER_APPLY
      value: "true"
    # Data retention (audit D5): RETENTION_ENABLED=true is the code default
    # (dry-run). APPLY=true arms real deletes of soft-deleted threads >30d,
    # synthetic threads >7d, and append-only events >180d — org-scoped,
    # batch-capped. Dry-run verified on dev first (2026-07-13: 5 soft-deleted
    # threads / 28 msgs / 62 checkpoints, 0 append-only rows, synthetic-thread
    # backlog — all safe). Rollback: flip to "false", values-only.
    - name: RETENTION_APPLY
      value: "true"
    - name: PYTHONPATH
      value: "/app"
    - name: LOG_LEVEL
      value: "DEBUG"
    - name: WORKERS
      value: "1"
    - name: TIMEOUT
      value: "300"
    # Durable agent dispatch (audit X1): route POST /agent/execute through the
    # Celery `agent_runs` queue instead of request-local BackgroundTasks, so a
    # pod kill after the job_id response no longer loses the run. Idempotency
    # key + one-shot claim make redelivery safe; SSE streaming path unchanged.
    # QUEUED-claim protocol rollout is deliberately two-phase because API and
    # worker Deployments roll independently: ship workers that accept both the
    # legacy RUNNING rows and new QUEUED rows while dispatch stays background,
    # then flip this value back to "celery" after every worker is updated.
    # Requires the celery worker to consume the `agent_runs` queue (-Q).
    - name: AGENT_DISPATCH_BACKEND
      value: "background"
    # Project skills rollout: enable the descriptor enforcement, catalog API,
    # and progressive loader together in the shared dev environment only.
    # Each remains independently reversible with a values-only deploy; do not
    # copy these flags to values-production.yaml before cohort validation.
    - name: AGENT_TOOL_REGISTRY_ENFORCEMENT_ENABLED
      value: "true"
    - name: PROJECT_SKILL_CATALOG_ENABLED
      value: "true"
    - name: PROJECT_SKILL_RUNTIME_ENABLED
      value: "true"
    - name: PROJECT_SKILL_SNAPSHOT_RETENTION_DAYS
      value: "30"
    # Cap glibc per-thread arenas to reduce RSS bloat (default 8*CPU on
    # multi-core). Combined with WORKERS=1, cuts steady-state memory ~30-40%.
    - name: MALLOC_ARENA_MAX
      value: "2"
    - name: CORS_ORIGINS
      value: "https://dev-app.gen-text.app,http://localhost:3000,http://127.0.0.1:3000,https://goodwiinz.tech,https://www.goodwiinz.tech"
    # Canonical frontend host for CLI-auth device-login approval links.
    # Set explicitly so the browser_url doesn't ride on CORS_ORIGINS[0] (still
    # dev-app.gen-text.app) — the frontend now lives at goodwiinz.tech. See
    # backend/src/api/auth/cli_auth.py::_frontend_base_url.
    - name: FRONTEND_BASE_URL
      value: "https://goodwiinz.tech"
    # CORS_ORIGIN_REGEX: defined in Infisical `/app` (env=dev) → synced into
    # the `app-secrets` K8s Secret, exposed via envFrom above. Set the regex
    # there to the project-specific Vercel slug (e.g.
    # ^https://nous-platform-[a-z0-9-]+\.vercel\.app$). Empty disables.
    # Database pool sizing: tuned for Supabase session-mode pooler limits
    # (pool_size lifted to 25). Reduce if switching to transaction-mode pooler.
    # Sync pool serves request paths too (RBAC dep, evidence/KG/user-behavior/
    # compliance routers); 1+1 exhausted under concurrent guarded requests and
    # restarted the backend, so it gets 2+2. Backend worst case: async 5 +
    # sync 4 = 9 (see celeryWorker budget math below).
    - name: DB_ASYNC_POOL_SIZE
      value: "3"
    - name: DB_ASYNC_MAX_OVERFLOW
      value: "2"
    - name: DB_SYNC_POOL_SIZE
      value: "2"
    - name: DB_SYNC_MAX_OVERFLOW
      value: "2"
    # Sentry: SENTRY_DSN comes from the `app-secrets` external secret via envFrom.
    # No-op if the key is absent.
    - name: SENTRY_ENVIRONMENT
      value: "dev"
    # stable LangSmith project; do NOT suffix per-session
    - name: LANGSMITH_PROJECT
      value: "rag-agent-dev"
    - name: LANGCHAIN_PROJECT
      value: "rag-agent-dev"
    # Server-canonical persistence rollout (PR 4a, dev soak): the backend
    # persists the assistant row synchronously before `done` and returns the
    # persisted ids in the done payload (#986). Inert for legacy clients —
    # mode is chosen by which thread_id the client sends. The frontend half
    # is NEXT_PUBLIC_SERVER_CANONICAL_CHAT on the Vercel dev project (#993).
    - name: AGENT_CANONICAL_PERSISTENCE
      value: "true"
    # Option B (checkpoint-authoritative history, #1395 research): the
    # checkpoint is the model-context source of truth; only the newest user
    # turn is appended per request. With this OFF every turn runs the legacy
    # B1 fallback, which re-derives ids for the resent history and duplicates
    # every user message in the checkpoint (observed 2x per turn, 4x on a
    # HITL turn — trace thread e88fdbf7, 2026-08-12). Rollback: set "false".
    - name: AGENT_SERVER_SIDE_HISTORY
      value: "true"
    - name: SENTRY_TRACES_SAMPLE_RATE
      value: "1.0"
    - name: SENTRY_PROFILES_SAMPLE_RATE
      value: "0.0"
    - name: NEO4J_URI
      value: "bolt://nous-dev-knowledge-graph-analytics-neo4j:7687"
    # S3-Compatible Object Storage (DigitalOcean Spaces)
    - name: STORAGE_BACKEND
      value: "s3"
    - name: S3_ENDPOINT_URL
      value: "https://nyc3.digitaloceanspaces.com"
    - name: S3_BUCKET_NAME
      value: "rag-system-storage"
    - name: S3_REGION
      value: "nyc3"
    - name: S3_CDN_ENDPOINT
      value: "https://rag-system-storage.nyc3.cdn.digitaloceanspaces.com"
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: spaces-credentials
          key: S3_ACCESS_KEY
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: spaces-credentials
          key: S3_SECRET_KEY
    # Azure OpenAI (Chat / Agent)
    - name: AZURE_OPENAI_CHAT_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_ENDPOINT
    - name: AZURE_OPENAI_CHAT_API_KEY
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_API_KEY
    - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
    - name: AZURE_OPENAI_CHAT_API_VERSION
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_API_VERSION
  healthCheck:
    enabled: true
    # Process-alive path for liveness + startup (unconditional /health handler).
    path: /health
    livenessPath: /health
    startupPath: /health
    # Dependency-aware path for readiness (checks Postgres + Redis, cached ~5s).
    readinessPath: /health/readiness
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 18
    initialDelaySeconds: 10
    periodSeconds: 15
    # Liveness exists to catch a dead process, not a slow one. With a single
    # worker and in-process agent work, CPU-throttle bursts pushed /health past
    # 5s while the app was still serving; 3x5s killed it mid-SSE-stream
    # ("Stream ended before completion" in the chat UI). Tolerate ~90s of
    # degradation before restarting; readiness (unchanged) already sheds
    # traffic during the burst.
    timeoutSeconds: 10
    failureThreshold: 6
    # Readiness is deliberately slack: it gates the LB, so a transient DB/Redis
    # blip must not flap every pod out at once. failureThreshold >= 3 and
    # periodSeconds >= 10 are enforced as floors in the template.
    readinessInitialDelaySeconds: 5
    readinessPeriodSeconds: 10
    readinessTimeoutSeconds: 5
    readinessFailureThreshold: 3
  initContainers:
    waitForPostgres: true
    waitForRedis: false
    # Run `alembic upgrade heads` before starting the app. Prevents schema drift
    # like the chat_messages.tool_executions UndefinedColumnError seen in dev.
    runMigrations: true
    waitForNeo4j: false
# ──────────────────────────────────────────────
# All databases are external (DO Managed)
# ──────────────────────────────────────────────
postgresql:
  enabled: false
redis:
  enabled: false
neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: "5.26-community"
    pullPolicy: IfNotPresent
  # password: supply via --set neo4j.password=... at deploy time
  advertisedAddress: "dev-neo4j.gen-text.app"
  persistence:
    size: 5Gi
  resources:
    # 128m heap + 64m pagecache under a 512Mi container limit was guaranteed
    # OOMKill: the JVM base + Neo4j overhead alone exceeds that. Neo4j was
    # crash-looping (OOMKilled, not Ready), taking the whole KG offline.
    # heap 1g + pagecache 512m fit under a 2Gi limit with room for JVM
    # metaspace/threads/direct buffers. request == limit so it is not evicted.
    heapSize: "1g"
    pagecacheSize: "512m"
    container:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 2Gi
celeryWorker:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    # Capped at 3 (was 5) to bound the Supabase session-mode pooler budget.
    # Worst-case client math (pooler cap 25): backend 9 + beat 3 + 3*3 workers
    # 9 + synthetic 3 = 24, leaving headroom 1. Raise only after the pooler
    # pool_size is lifted (or workers move to the transaction pooler).
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    # A backlog of heavy indexing tasks pressures RAM before CPU, so add workers
    # on memory too. Requires the memory metric block in templates/hpa.yaml.
    targetMemoryUtilizationPercentage: 75
    # TODO (audit P1.6 / finding X5): CPU+memory is backlog-blind for I/O-bound
    # LLM/ingestion tasks. The queue-depth signal is now exported as the
    # Prometheus gauge `celery_queue_depth{queue=...}` (backend
    # observability/celery_queue_metrics.py). To scale on it, deploy KEDA (add a
    # ScaledObject on the Redis list length) or prometheus-adapter (expose an
    # external metric) and add a `- type: External` metric to templates/hpa.yaml.
    # Deferred: no metrics adapter is deployed in the cluster yet.
  livenessProbe:
    commandTimeout: 60
    initialDelaySeconds: 60
    periodSeconds: 180
    timeoutSeconds: 90
    failureThreshold: 10
  resources:
    # request == limit for memory -> Guaranteed QoS, so this pod is evicted LAST
    # under node memory pressure, not first. This is what was OOM-evicting it:
    # used ~1.3Gi while requesting only 1Gi.
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 2Gi
  # Per-component DB pool override (appended after the shared backend.env in
  # templates/celery-worker-deployment.yaml; duplicate keys win last). Workers
  # only open an async engine for the periodic beat tasks (reconcile/retention/
  # sweepers), so a request-serving pool is wasteful and saturates the Supabase
  # session-mode pooler (cap 25). Worst case per worker pod: async 1+1 + sync
  # 1+0 = 3 connections.
  env:
    - name: DB_ASYNC_POOL_SIZE
      value: "1"
    - name: DB_ASYNC_MAX_OVERFLOW
      value: "1"
    - name: DB_SYNC_POOL_SIZE
      value: "1"
    - name: DB_SYNC_MAX_OVERFLOW
      value: "0"
celeryBeat:
  enabled: true
  # Per-component DB pool override (see celeryWorker.env above). Beat is a
  # singleton scheduler; worst case 3 connections (async 1+1 + sync 1+0).
  env:
    - name: DB_ASYNC_POOL_SIZE
      value: "1"
    - name: DB_ASYNC_MAX_OVERFLOW
      value: "1"
    - name: DB_SYNC_POOL_SIZE
      value: "1"
    - name: DB_SYNC_MAX_OVERFLOW
      value: "0"
  resources:
    # memory request == limit so beat is never "over request" and is not a
    # first-choice eviction target. It was OOM-evicted using ~686Mi against a
    # 384Mi request, which is why this was raised to 768Mi.
    #
    # 768Mi then stopped being survivable: the scheduler OOMKilled during
    # startup (log ends at the celery banner, before the first tick) and
    # crashlooped, so no beat-scheduled task ran at all. This is a floor, not
    # a leak — celery-worker runs the same image and the same
    # src.tasks.celery_app import graph and sits at ~1.16Gi idle, so merely
    # importing the app costs more than beat's whole limit. 1536Mi clears the
    # import cost with headroom; if it ever does leak past that it is
    # OOMKilled and restarts cleanly (beat is a singleton scheduler).
    limits:
      cpu: 200m
      memory: 1536Mi
    requests:
      cpu: 50m
      memory: 1536Mi
prometheus:
  enabled: false
grafana:
  enabled: false
nginx-ingress-controller:
  enabled: false
monitoring:
  enabled: false
# ──────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
podSecurityPolicy:
  enabled: false
# NetworkPolicy — ingress default-deny for the backend pods (audit finding X6).
# Kept DISABLED pending live-cluster selector verification; flipping `enabled:
# true` renders an INGRESS-ONLY policy (egress lockdown deferred as a follow-up:
# the external managed deps make egress the outage-prone half). To enable:
#   1. Confirm the ingress-nginx controller runs in the `ingress-nginx`
#      namespace: `kubectl get ns -L kubernetes.io/metadata.name | grep nginx`.
#      If it lives elsewhere, override `networkPolicy.ingressControllerNamespace`.
#   2. Confirm Prometheus runs in `monitoring` (or override `monitoringNamespace`).
#   3. Set `enabled: true`, let ArgoCD sync, then verify: dev-api.gen-text.app
#      still serves, backend readiness probes stay green (kubelet host->pod), and
#      backend metrics still scrape. Rollback = set `enabled: false` (policy is
#      pruned on next sync).
networkPolicy:
  enabled: false
  ingress:
    enabled: true
  egress:
    enabled: false
podDisruptionBudget:
  enabled: true
  # R5-M32: minAvailable=1 on replicas=1 blocks every drain/upgrade.
  maxUnavailable: 1
serviceAccount:
  create: true
  annotations: {}
  name: ""
# ──────────────────────────────────────────────
# Synthetic traffic generator — in-process LangGraph driver that produces
# continuous LangSmith traces in rag-agent-dev while the dev agent is idle.
# Runs every 20 min; set enabled: false to pause without code changes.
# ──────────────────────────────────────────────
# ──────────────────────────────────────────────
# KEDA queue-depth autoscaling for the celery-worker (audit P1.6 / finding X5)
# ──────────────────────────────────────────────
# OFF: the KEDA operator is not installed in rag-dev yet. Flipping enabled: true
# here is the LAST step of the rollout — install KEDA first, ensure the
# redis-credentials secret exposes REDIS_HOST/REDIS_PORT/REDIS_PASSWORD, then
# flip. See docs/decisions/worker-autoscaling.md. When enabled, the plain
# CPU/memory worker HPA above (celeryWorker.autoscaling) stops rendering — KEDA
# owns scaling. Rollback = set enabled: false (plain HPA re-renders on next sync).
keda:
  # ENABLED on dev: queue-depth worker autoscaling via the KEDA operator
  # (installed in the cluster, keda ns). This SUPPRESSES the plain CPU/memory
  # worker HPA (templates/hpa.yaml mutual exclusion) — KEDA reconciles its own.
  # Requires REDIS_PASSWORD synced into the redis-credentials secret; if KEDA
  # can't auth to Valkey, workers lose autoscaling. Rollback: enabled: false.
  enabled: true
  # min/max/polling/cooldown/scaleDown defaults live in values.yaml.
  redis:
    # DO Managed Valkey (Redis-protocol) endpoint — NON-SECRET host:port and
    # username, inlined into the ScaledObject trigger metadata.
    address: "rag-system-valkey-do-user-26519733-0.j.db.ondigitalocean.com:25061"
    username: "default"
    # Only the password is secret: pulled from the redis-credentials secret
    # (Infisical-managed) under the REDIS_PASSWORD key.
    authSecretName: redis-credentials
    passwordKey: REDIS_PASSWORD
    enableTLS: "true" # DO Managed Valkey is rediss://
    databaseIndex: "0"
    # triggers default to celery + document_processing (see values.yaml).
syntheticTraffic:
  enabled: true
  schedule: "*/20 * * * *"
  args: ["--rotate"]
  # One scenario per fire: SCENARIO_TIMEOUT_S (360 s) plus graph-build startup.
  # Raise to >= 2700 if args ever become ["--all"].
  activeDeadlineSeconds: 900
  # Keep ~one full scenario rotation of run history so heavy-scenario traces
  # (arxiv / kg / ingest) stay inspectable instead of being GC'd at limit 2.
  successfulJobsHistoryLimit: 8
  failedJobsHistoryLimit: 4
  # Loads the full agent graph once per run; 512Mi OOM-killed every fire.
  # Sized to the agent's real footprint (backend serving pod uses 2Gi).
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi
