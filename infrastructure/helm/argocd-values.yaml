# ArgoCD resource limits (sized for the lean EKS dev node; carried over from
# the DOKS-era clusterlint sizing).
# Install: helm install argocd argo/argo-cd -n argocd --create-namespace -f infrastructure/helm/argocd-values.yaml

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # The rag repo pack is ~1.3 GiB — the default 90s git fetch timeout
  # (ARGOCD_GIT_REQUEST_TIMEOUT) is not enough from the EKS node, so every
  # refresh died with `git fetch origin --tags --force --prune failed
  # timeout after 1m30s` (Task 5). Wired via argocd-cmd-params-cm below —
  # setting repoServer.env directly would duplicate the chart's
  # configMapKeyRef entry.
  configs:
    params:
      "reposerver.git.request.timeout": "600"
  # copyutil init container
  copyutil:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
