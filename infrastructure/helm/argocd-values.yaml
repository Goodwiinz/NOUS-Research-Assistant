# ArgoCD resource limits (sized for the lean EKS dev node; carried over from
# the DOKS-era clusterlint sizing).
# Install: helm install argocd argo/argo-cd -n argocd --create-namespace -f infrastructure/helm/argocd-values.yaml

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # copyutil init container
  copyutil:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# NOTE: configs.params is a TOP-LEVEL chart key. A previous attempt nested it
# under repoServer.configs, which the chart silently ignored (argocd-cmd-params-cm
# never contained the git timeout) -> every fresh git fetch of the big rag repo
# died at the 90s git request timeout.
configs:
  params:
    # git fetch/ls-remote budget inside repo-server (default 90s < fetch time)
    reposerver.git.request.timeout: "600"
    # The rag repo pack is ~1.3 GiB; the controller's rpc deadline to the
    # repo-server (default 60s) expires mid-fetch -> GenerateManifest
    # DeadlineExceeded. Give the reconcile path room to pull.
    controller.repo.server.timeout.seconds: "300"

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
