# The Helm chart owns dev-api.goodwiinz.tech. This overlay only adds the
# websocket hostname, routed to the same FastAPI backend Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-ingress
  namespace: multimodal-rag-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 30s;
      proxy_send_timeout 86400s;
      proxy_read_timeout 86400s;
      client_max_body_size 10M;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Connection $connection_upgrade;
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: dev-ws.goodwiinz.tech
    external-dns.alpha.kubernetes.io/ttl: "300"
    external-dns.alpha.kubernetes.io/provider: cloudflare
  labels:
    app: backend
    component: websocket-ingress
    version: 1.0.0
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dev-ws.goodwiinz.tech
    secretName: dev-ws-goodwiinz-tech-tls
  rules:
  - host: dev-ws.goodwiinz.tech
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nous-dev-aws-knowledge-graph-analytics-backend
            port:
              number: 80
