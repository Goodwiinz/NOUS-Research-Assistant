# ALB patch for the websocket ingress (backend-service:8001). Long-lived
# connections: raise the ALB idle timeout toward the nginx-era 86400s ceiling
# (ALB max 4000s). $patch: replace swaps the entire annotation map.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-ingress
  annotations:
    # Replace the whole annotation map — nginx annotations must not survive.
    $patch: replace
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Shared group: pins backend + websocket ingresses onto a single ALB.
    alb.ingress.kubernetes.io/group.name: "nous-dev"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /ws/health
    alb.ingress.kubernetes.io/idle-timeout: "4000"
    # TLS is AWS ACM (NOT cert-manager): terraform aws_acm_certificate
    # (Task 3) with DNS validation — the validation CNAME is managed manually
    # in Namify, the current authoritative DNS provider.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:267685730035:certificate/5e716108-f6cc-464a-9616-14f9d71754dd # Task 3 terraform aws_acm_certificate output; DNS validation CNAME added manually in Namify
    external-dns.alpha.kubernetes.io/hostname: dev-ws.goodwiinz.tech
    external-dns.alpha.kubernetes.io/ttl: "300"
    external-dns.alpha.kubernetes.io/provider: cloudflare
spec:
  ingressClassName: alb
