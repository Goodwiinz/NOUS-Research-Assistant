# ALB patch for the backend ingress. $patch: replace swaps the ENTIRE
# annotation map (nginx annotations must not survive on an ALB ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    # Replace the whole annotation map — nginx annotations must not survive.
    $patch: replace
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Shared group: pins backend + websocket ingresses onto a single ALB.
    alb.ingress.kubernetes.io/group.name: "nous-dev"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # SSE/streaming: keep the ALB idle timeout at/above the app TIMEOUT (300s)
    # so server-sent events are not severed mid-stream.
    alb.ingress.kubernetes.io/idle-timeout: "300"
    # TLS is AWS ACM (NOT cert-manager): terraform aws_acm_certificate
    # (Task 3) with DNS validation — the validation CNAME is added manually
    # in Cloudflare (DNS is on Cloudflare, not Route53).
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:267685730035:certificate/4597607e-7aa4-4e43-960d-9ec80c8d34c7 # Task 3 terraform aws_acm_certificate output; DNS validation CNAME added manually in Cloudflare
    # Kept from base; external-dns stays on Cloudflare, records -> ALB hostname.
    external-dns.alpha.kubernetes.io/hostname: api.multimodal-rag.example.com
    external-dns.alpha.kubernetes.io/ttl: "300"
    external-dns.alpha.kubernetes.io/provider: cloudflare
spec:
  ingressClassName: alb
