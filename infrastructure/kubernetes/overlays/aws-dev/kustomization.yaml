# aws-dev overlay — NOUS on EKS us-east-1 (nous-dev-cluster)
# Adds the websocket hostname through the aws-load-balancer-controller.
# The Helm chart owns the API hostname and backend Service.
#
# Note: sibling overlays/production/ is plain multi-doc YAML with no
# kustomization; this is the first kustomize overlay in the tree, created per
# docs/plans/2026-09-14-do-to-aws-migration.md Task 4. The ArgoCD app-of-apps
# for aws-dev (Task 5) points at this directory.
#
# Helm-managed runtime (the chart that ArgoCD dev actually deploys) is
# configured separately via infrastructure/helm/knowledge-graph-analytics/values-aws.yaml.
#
# WIREUP (Task 5): hosts cut over to dev-api.goodwiinz.tech (backend) and
# dev-ws.goodwiinz.tech (websocket); namespace stays multimodal-rag-system —
# the ArgoCD apps target it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
  # NOTE: the gp3 StorageClass is NOT here — it is cluster-scoped and the
  # nous-platform AppProject whitelist does not include storage.k8s.io, so it
  # is applied out-of-ArgoCD from infrastructure/kubernetes/aws-bootstrap/ instead.

patches:
  - path: websocket-ingress-alb-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: websocket-ingress
