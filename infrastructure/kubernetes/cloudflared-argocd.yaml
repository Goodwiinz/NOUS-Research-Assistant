# The token lives only in argocd/cloudflared-tunnel-token (key: token).
# The dashboard route points to https://argocd-server.argocd.svc.cluster.local:443
# with originServerName=argocd-server.argocd.svc.cluster.local and
# caPool=/etc/argocd-tls/ca.pem. Keep origin TLS verification enabled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-argocd
  namespace: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-argocd
  template:
    metadata:
      labels:
        app: cloudflared-argocd
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          volumeMounts:
            - name: argocd-tls
              mountPath: /etc/argocd-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
      volumes:
        - name: argocd-tls
          secret:
            secretName: argocd-secret
            items:
              - key: tls.crt
                path: ca.pem
