apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nous-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: NOUS Multimodal Intelligence Platform

  # Allowed source repos: this Git repo + Helm registries we pull operators from
  sourceRepos:
    - "https://github.com/Goodwiinz/rag.git"
    - "https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts"

  # Allow deploying to dev, staging, production, argocd, and operator namespaces
  destinations:
    - server: https://kubernetes.default.svc
      namespace: rag-dev
    - server: https://kubernetes.default.svc
      namespace: rag-staging
    - server: https://kubernetes.default.svc
      namespace: rag-production
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: infisical-operator
    # EKS (aws-dev, Task 5): app manifests + helm release target this ns
    - server: https://kubernetes.default.svc
      namespace: multimodal-rag-system

  # Allowed cluster-scoped resources
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: cert-manager.io
      kind: ClusterIssuer
    # Required by the Infisical operator chart (CRDs + cluster-scoped RBAC)
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # The aws-dev app-of-apps watches infrastructure/argocd/applications/,
    # which contains this AppProject — the root must be able to (re)apply it.
    - group: argoproj.io
      kind: AppProject

  # Allowed namespace-scoped resources
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: rbac.authorization.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: "*"
    # Argo Application objects (root app composes children)
    - group: argoproj.io
      kind: "*"
    # InfisicalSecret CRDs created by the Helm chart
    - group: secrets.infisical.com
      kind: "*"
    - group: external-secrets.io
      kind: "*"
    # KEDA ScaledObject + TriggerAuthentication (worker autoscaling, finding X5)
    - group: keda.sh
      kind: "*"

  # Orphaned resource monitoring
  orphanedResources:
    warn: true
