apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nous-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nous-platform
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nous-platform

  source:
    repoURL: https://github.com/goodwiins/NOUS-Research-Assistant.git
    targetRevision: develop
    path: infrastructure/helm/knowledge-graph-analytics
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: rag-dev

  # Auto-sync: dev deploys automatically when develop branch changes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
