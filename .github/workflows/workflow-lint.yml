name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache actionlint binary
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: /usr/local/bin/actionlint
          # Version-pinned key — bump alongside ACTIONLINT_VERSION below.
          key: actionlint-${{ runner.os }}-v1.7.7

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin actionlint

      - name: Run actionlint
        env:
          SHELLCHECK_OPTS: "-e SC2086 -e SC2129"
        # Whole tree, always. The previous diff-only mode let breakage in
        # unchanged workflows (e.g. from a renamed composite action) ride
        # through untouched PRs.
        run: actionlint

      - name: Validate composite actions
        # actionlint only checks workflow files; composite action.yml files
        # were previously unvalidated entirely. Parse them and assert the
        # minimal contract (name + runs).
        run: |
          shopt -s nullglob
          status=0
          for f in .github/actions/*/action.yml .github/actions/*/action.yaml; do
            echo "Validating $f"
            python3 - "$f" <<'EOF' || status=1
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1]))
          assert isinstance(d, dict) and "runs" in d and "name" in d, "missing name/runs"
          EOF
          done
          exit "$status"
