name: Secret Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          # Live base BRANCH, not the creation-time-frozen base.sha — a stale
          # base charges every commit the base gained since to this PR's scan.
          # Env indirection: never interpolate github.* into a run: block.
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          gitleaks git . --redact --config .gitleaks.toml --verbose \
            --log-opts="origin/${PR_BASE_REF}..HEAD"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="-1"
          else
            LOG_OPTS="${{ github.event.before }}..${{ github.sha }}"
          fi
          gitleaks git . --redact --config .gitleaks.toml --verbose --log-opts="$LOG_OPTS"

      - name: Scan current commit
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git . --redact --config .gitleaks.toml --verbose --log-opts="-1"
