name: Deploy to EKS

# TODO(cutover): staging/production targets below were retired as DO/Argo CD
# vestiges (see header on the old DigitalOcean version). Registry and cluster
# auth are migrated to ECR/EKS here; the dispatch jobs themselves stay as-is
# until the staging/production question is settled.
on:
  # Legacy staging/production path: manual only, and almost certainly
  # vestigial: the staging and production Argo CD Applications were retired in
  # #442 (infrastructure/argocd/applications/ holds only dev.yaml), and
  # CLUSTER_NAME below is `rag-cluster`, which is not the live cluster
  # (do-nyc3-rag-system-cluster). Kept, but it must not report green while
  # deploying nothing. Automatic dev release
  # (release-dev.yml) was removed as never-bootstrapped; dev images are no
  # longer built on develop pushes. Do not add a workflow_run trigger here.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Explicit existing image tag to deploy"
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false  # Don't cancel ongoing deploys

env:
  REGISTRY: 267685730035.dkr.ecr.us-east-1.amazonaws.com
  HELM_CHART_PATH: infrastructure/helm/knowledge-graph-analytics
  CLUSTER_NAME: nous-dev-cluster

permissions:
  contents: read

jobs:
  # Manual identity validation. This workflow does not infer an image from a
  # branch tip or a preceding Docker Build run.
  check-build:
    name: Check Build Status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - name: Check if we should deploy
        id: check
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            echo "::error::An explicit existing image tag is required"
            exit 1
          fi

          echo "image_tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: check-build
    if: |
      needs.check-build.outputs.should_deploy == 'true' &&
      inputs.environment == 'staging'
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
      url: https://staging.gen-text.app

    steps:
      - name: Checkout repository
        # v4.2.2 - pinned for security
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::267685730035:role/nous-github-eks-deploy
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region us-east-1

      - name: Install Helm
        # v3.0.0 - pinned for security
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: "3.13.0"

      # No ECR login here: kubelet pulls images via the node instance role.
      # The deploy job only orchestrates Helm/kubectl against the cluster.

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.check-build.outputs.image_tag }}
        run: |
          helm upgrade --install rag-staging ${{ env.HELM_CHART_PATH }} \
            --namespace rag-staging \
            --create-namespace \
            --set global.environment=staging \
            --set backend.image.repository=${{ env.REGISTRY }}/nous/backend \
            --set backend.image.tag=$IMAGE_TAG \
            --set backend.replicaCount=1 \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/rag-staging-backend -n rag-staging --timeout=5m

      - name: Run smoke tests
        run: |
          # A failing health check must fail the job. It used to end in
          # `|| echo "Health check pending..."`, so a broken deploy still
          # reported green (R5-M27).
          STAGING_URL=$(kubectl get ingress -n rag-staging -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || echo "")

          if [ -n "$STAGING_URL" ]; then
            echo "Running smoke tests against https://$STAGING_URL"
            curl -sf "https://$STAGING_URL/api/health"
          else
            echo "No ingress found, checking service directly..."
            kubectl port-forward svc/rag-staging-backend 8000:8000 -n rag-staging &
            sleep 5
            curl -sf http://localhost:8000/health
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # NOT `needs: deploy-staging`: the two jobs are mutually exclusive by the
    # `inputs.environment` gate below, so a production dispatch always skipped
    # staging, which skipped production too — and the run still reported green
    # (R5-M27).
    needs: check-build
    if: |
      needs.check-build.outputs.should_deploy == 'true' &&
      inputs.environment == 'production'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://gen-text.app

    steps:
      - name: Checkout repository
        # v4.2.2 - pinned for security
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::267685730035:role/nous-github-eks-deploy
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region us-east-1

      - name: Install Helm
        # v3.0.0 - pinned for security
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: "3.13.0"

      - name: Create backup before deploy
        run: |
          echo "Creating pre-deploy backup..."
          kubectl get all -n rag-production -o yaml > pre-deploy-backup.yaml || true

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.check-build.outputs.image_tag }}
        run: |
          helm upgrade --install rag-production ${{ env.HELM_CHART_PATH }} \
            --namespace rag-production \
            --create-namespace \
            --set global.environment=production \
            --set backend.image.repository=${{ env.REGISTRY }}/nous/backend \
            --set backend.image.tag=$IMAGE_TAG \
            --set backend.replicaCount=3 \
            --set backend.autoscaling.enabled=true \
            --set backend.autoscaling.minReplicas=3 \
            --set backend.autoscaling.maxReplicas=10 \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/rag-production-backend -n rag-production --timeout=10m

      - name: Run production health checks
        run: |
          PROD_URL=$(kubectl get ingress -n rag-production -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || echo "")

          if [ -z "$PROD_URL" ]; then
            echo "::error::No ingress found in rag-production; cannot verify the deploy"
            exit 1
          fi

          echo "Running health checks against https://$PROD_URL"

          # Health endpoint
          curl -sf "https://$PROD_URL/api/health"

          # Ready endpoint
          curl -sf "https://$PROD_URL/api/ready" || echo "Ready check not implemented"

          echo "Production deployment verified!"

      - name: Upload backup artifact
        # v4.4.3 - pinned for security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-deploy-backup-${{ github.run_id }}
          path: pre-deploy-backup.yaml
          retention-days: 7

  # Rollback job (manual trigger only)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && inputs.environment == 'production'
    needs: deploy-production
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::267685730035:role/nous-github-eks-deploy
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region us-east-1

      - name: Rollback Helm release
        run: |
          echo "Rolling back production deployment..."
          helm rollback rag-production -n rag-production

          kubectl rollout status deployment/rag-production-backend -n rag-production --timeout=5m

          echo "Rollback complete!"

  # Deploy summary
  deploy-summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: [check-build, deploy-staging, deploy-production]
    if: always()
    permissions:
      contents: read
    env:
      STAGING_RESULT: ${{ needs.deploy-staging.result }}
      PROD_RESULT: ${{ needs.deploy-production.result }}
      IMAGE_TAG: ${{ needs.check-build.outputs.image_tag }}
    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "$STAGING_RESULT" == "success" ]; then
            echo "| Staging | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$STAGING_RESULT" == "skipped" ]; then
            echo "| Staging | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Staging | ❌ $STAGING_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PROD_RESULT" == "success" ]; then
            echo "| Production | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$PROD_RESULT" == "skipped" ]; then
            echo "| Production | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Production | ❌ $PROD_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi
