name: GitOps Image Update

# Automatic dev promotion (release-dev.yml) was removed as never-bootstrapped
# (see .github/workflows/README.md). This workflow only keeps the retired
# production manual operation below; it cannot participate in an automatic
# Docker -> GitOps chain or write to develop.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Manual operation to perform"
        required: true
        type: choice
        options:
          - promote-to-production
      image_tag:
        description: "Existing image tag to deploy"
        required: true
        type: string

concurrency:
  group: gitops-manual-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Production promotion is also manual and unrelated to the (now-removed)
  # dev exact-SHA release path.
  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    if: inputs.action == 'promote-to-production'
    environment:
      name: production
    steps:
      # Same contract as docker-build.yml's "Validate requested source identity":
      # the only tags that exist in the registry are the full-SHA trace tags
      # docker-build.yml pushes as backend:<source_sha>. Anything else is a typo
      # that would be committed to values-production.yaml on main and crashloop
      # the cluster (R5-L22).
      - name: Validate requested image tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full lowercase 40-character commit SHA"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.6"
          curl -sL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update production values
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          VALUES_FILE="infrastructure/helm/knowledge-graph-analytics/values-production.yaml"
          yq -i '.backend.image.tag = strenv(TAG)' "$VALUES_FILE"
          yq '.backend.image' "$VALUES_FILE"

      - name: Commit and push
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/knowledge-graph-analytics/values-production.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(gitops): promote $TAG to production [skip ci]"
          git push origin main

      - name: Notify that a manual sync is required
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          {
            echo "## Production Image Updated"
            echo
            echo "Image tag \`$TAG\` was committed to \`values-production.yaml\`."
            echo
            echo "A separately authorized manual Argo CD sync is still required."
          } >> "$GITHUB_STEP_SUMMARY"
