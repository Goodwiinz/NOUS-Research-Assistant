name: Release Dev

# A green full push run produces a digest-pinned GitOps PR. GITHUB_TOKEN
# cannot bypass develop's required checks; auto-merge waits for those checks.
# Propose values-aws.yaml only; DO values-dev.yaml stays frozen for rollback.
on:
  workflow_run:
    workflows: ["Test Pipeline"]
    types: [completed]
    branches: [develop]

concurrency:
  group: release-dev
  cancel-in-progress: true

permissions:
  contents: read
  # Caller permissions cap the reusable docker-build workflow; id-token is
  # required there for GitHub OIDC -> AWS (ECR push).
  id-token: write

jobs:
  prepare:
    name: Check release source
    # PR runs can use a lighter profile, including PRs whose head is develop.
    # Only a protected-branch push proves the full source verification ran.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2
      - name: Skip stale sources and deployment-only commits
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin develop
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ] || [ "$(git rev-parse origin/develop)" != "$SOURCE_SHA" ]; then
            echo "develop moved; the newer source run owns release preparation"
            exit 0
          fi
          if git diff --quiet HEAD^ HEAD -- . ':!infrastructure/helm/knowledge-graph-analytics/values-aws.yaml'; then
            echo "Only deployment values changed; do not create a release loop"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Verify release branch protection
        if: steps.source.outputs.needed == 'true'
        env:
          # Reading branchProtectionRule needs administration:read, which the
          # job token lacks; the release PAT has it.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          # Preserve GraphQL variables as literals instead of shell expressions.
          GRAPHQL_QUERY: >-
            query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { ref(qualifiedName: "refs/heads/develop") { branchProtectionRule { requiresStatusChecks requiresStrictStatusChecks requiredStatusChecks { context app { databaseId } } } } } }
        run: |
          OWNER="${GH_REPO%/*}"
          REPO="${GH_REPO#*/}"
          gh api graphql -f owner="$OWNER" -f name="$REPO" \
            -f query="$GRAPHQL_QUERY" \
            --jq '.data.repository.ref.branchProtectionRule' | python3 scripts/ci/check_release_protection.py

  build:
    name: Build tested image
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  promote:
    name: Propose dev image update
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Verify release branch protection
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          # Preserve GraphQL variables as literals instead of shell expressions.
          GRAPHQL_QUERY: >-
            query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { ref(qualifiedName: "refs/heads/develop") { branchProtectionRule { requiresStatusChecks requiresStrictStatusChecks requiredStatusChecks { context app { databaseId } } } } } }
        run: |
          OWNER="${GH_REPO%/*}"
          REPO="${GH_REPO#*/}"
          gh api graphql -f owner="$OWNER" -f name="$REPO" \
            -f query="$GRAPHQL_QUERY" \
            --jq '.data.repository.ref.branchProtectionRule' | python3 scripts/ci/check_release_protection.py

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.6"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v3.0.0
        with:
          version: "3.13.0"

      - name: Open checked GitOps pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # PRs created with GITHUB_TOKEN need workflow approval. Use this
          # repo-scoped token only for PR creation so PR checks start normally.
          PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image identity"
            exit 1
          fi
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "$SOURCE_SHA" ]; then
            echo "develop moved; the newer source run owns promotion"
            exit 0
          fi
          # AWS/EKS dev lane: bump the ECR-pinned identity in values-aws.yaml.
          # The chart renders repository@sha256:<digest> when digest is set
          # (templates/_helpers.tpl backendImage), falling back to :tag.
          VALUES_FILE="infrastructure/helm/knowledge-graph-analytics/values-aws.yaml"
          yq -i '.backend.image.digest = strenv(DIGEST)' "$VALUES_FILE"
          yq -i '.backend.image.tag = strenv(SOURCE_SHA)' "$VALUES_FILE"
          yq -i '.backend.image.sourceSha = strenv(SOURCE_SHA)' "$VALUES_FILE"
          if git diff --quiet; then
            echo "Image already selected"
            exit 0
          fi

          # Validate the actual AWS candidate before requesting auto-merge.
          # Helm Validate is not a required repository check, so auto-merge
          # alone would not wait for it.
          CHART="infrastructure/helm/knowledge-graph-analytics"
          helm lint "$CHART" -f "$CHART/values.yaml" -f "$VALUES_FILE"
          helm template nous-dev-aws "$CHART" -f "$CHART/values.yaml" -f "$VALUES_FILE" >/dev/null

          BRANCH="codex/release-dev-$SOURCE_SHA"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            # Reuse only an identical proposal; never overwrite branch edits.
            git diff --exit-code FETCH_HEAD
            PROPOSAL_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git checkout -b "$BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$VALUES_FILE"
            git commit -m "chore(gitops): propose dev image ${SOURCE_SHA:0:7}"
            PROPOSAL_SHA="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          # The source freshness gate above ensures only the newest source
          # retires older release proposals. Preserve this run's proposal.
          SUPERSEDED_PRS="$(gh pr list --base develop --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("codex/release-dev-")) | [.number, .headRefName] | @tsv')"
          while IFS=$'\t' read -r number head; do
            if [ -n "$number" ] && [ "$head" != "$BRANCH" ]; then
              gh pr close "$number" --delete-branch --comment "Superseded by the proposal for ${SOURCE_SHA:0:7}."
            fi
          done <<< "$SUPERSEDED_PRS"

          PR_URL="$(gh pr list --base develop --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_TOKEN" ]; then
            echo "::warning::RELEASE_PR_TOKEN is not set: approve this PR's workflow runs or it cannot merge."
          fi
          if [ -z "$PR_URL" ]; then
            printf 'Deploy tested source %s at immutable digest %s.\n\nImage producer: %s\n\nAWS Helm values were validated before this proposal. Auto-merge waits for required checks; AWS Argo CD syncs the merged values from develop.\n' "$SOURCE_SHA" "$DIGEST" "$BUILD_URL" > "$RUNNER_TEMP/release-pr.md"
            PR_URL="$(GH_TOKEN="${PR_TOKEN:-$GH_TOKEN}" gh pr create --base develop --head "$BRANCH" --title "chore(gitops): deploy dev image ${SOURCE_SHA:0:7}" --body-file "$RUNNER_TEMP/release-pr.md")"
          fi
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "$SOURCE_SHA" ]; then
            echo "develop moved; do not enable auto-merge for this stale proposal"
            exit 0
          fi
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PROPOSAL_SHA"
          printf '## Dev image auto-merge enabled\n\n%s\n\nGitHub merges after required checks pass; AWS Argo CD syncs develop.\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
