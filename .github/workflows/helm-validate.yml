name: Helm Validate

# Lints and renders the knowledge-graph-analytics chart on PRs that touch it.
# There is otherwise no PR-time Helm gate (deploy.yml only runs Helm at deploy),
# so chart/template/values regressions could previously reach `develop` unseen.
on:
  pull_request:
    paths:
      - "infrastructure/helm/knowledge-graph-analytics/**"
      - ".github/workflows/helm-validate.yml"
  push:
    branches: [develop, main]
    paths:
      - "infrastructure/helm/knowledge-graph-analytics/**"
      - ".github/workflows/helm-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART: infrastructure/helm/knowledge-graph-analytics

jobs:
  helm-validate:
    name: Lint + render chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        # v3.0.0 — pinned for security (matches deploy.yml)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "3.13.0"

      - name: Helm lint (per-env value files)
        # ArgoCD/Helm always render base values.yaml PLUS an env overlay; the
        # base file alone is intentionally incomplete (e.g. neo4j.image), so lint
        # each real combination rather than the base on its own.
        run: |
          for env in dev staging production; do
            echo "::group::helm lint ($env)"
            helm lint "$CHART" -f "$CHART/values.yaml" -f "$CHART/values-$env.yaml"
            echo "::endgroup::"
          done

      - name: Helm template (render sanity, all envs)
        run: |
          for env in dev staging production; do
            echo "::group::helm template ($env)"
            helm template rag "$CHART" -f "$CHART/values.yaml" -f "$CHART/values-$env.yaml" >/dev/null
            echo "::endgroup::"
          done

      - name: NetworkPolicy render assertions
        run: bash "$CHART/tests/networkpolicy_render_test.sh"

      - name: Immutable backend image render assertions
        run: bash "$CHART/tests/backend_image_digest_render_test.sh"

      - name: Pod disruption budget render assertions
        run: bash "$CHART/tests/pdb_render_test.sh"
