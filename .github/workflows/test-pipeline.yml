name: Test Pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  DOCKER_BUILDKIT: "1"
  # NOTE: PIP_NO_CACHE_DIR is intentionally NOT set here. Setting it globally
  # makes pip ignore ~/.cache/pip on the runner, which silently turns every
  # actions/cache pip step in this file into a no-op. Slim Docker layers are
  # handled inside the Dockerfiles, not on the runner shell.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Browser-facing Supabase URL. supabase-js calls {URL}/auth/v1/<route> —
  # the prefix Kong strips in the hosted stack. Bare GoTrue serves at root,
  # so the browser goes through the auth-proxy nginx (compose service) which
  # strips /auth/v1 and answers CORS preflight. Playwright runs on the runner
  # host in this workflow, hence localhost + the proxy's published port 8999.
  # Anon JWT is signed with the same secret gotrue verifies with HS256 —
  # see docker-compose.ci.yml gotrue service for the matching env.
  NEXT_PUBLIC_SUPABASE_URL: "http://localhost:8999"
  SUPABASE_JWT_SECRET: "ci-test-supabase-jwt-secret-not-for-prod-use"
defaults:
  run:
    shell: bash
permissions:
  contents: read

jobs:
  # ==========================================================================
  # Code Quality Checks (Fast - Run First)
  # ==========================================================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the changed-file ratchet diffs against the PR base
          # (or push `before`) via merge-base, which a shallow clone breaks.
          fetch-depth: 0
      - name: Reject stale release proposals
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$RELEASE_BRANCH" =~ ^codex/release-dev-([0-9a-f]{40})$ ]]; then
            SOURCE_SHA="${BASH_REMATCH[1]}"
            git fetch origin develop
            if [ "$(git rev-parse origin/develop)" != "$SOURCE_SHA" ]; then
              echo "::error::Release proposal is stale; use the newer source release"
              exit 1
            fi
          fi
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Install the CURRENT pins directly instead of building Dockerfile.lint:
      # that image still ships ruff 0.1.8 / black 23.12.1 (years stale and
      # divergent from the live lane). Direct pip install is faster (no buildx,
      # no remote layer cache) and keeps the linters in sync with the repo.
      - name: Install lint tools (current pins)
        run: pip install ruff==0.15.15 black==26.5.1 isort==5.13.2 mypy==1.7.1 types-redis==4.6.0.20241004
      - name: Run Ruff (blocking)
        run: ruff check backend/src --output-format=github
      - name: Directory docs lint (blocking — carried from the fast lane)
        run: python3 scripts/docs/check_dir_docs.py
      # Blocking ratchet: changed Python files must pass the full formatter/
      # type gauntlet. New or touched code cannot add debt; the untouched
      # tree is covered by the advisory full-tree lanes below until their
      # debt reaches zero.
      - name: Changed-file quality gate (blocking)
        env:
          # base_ref (live base BRANCH), not pull_request.base.sha: GitHub
          # freezes base.sha at PR-creation time, so a stale base charged
          # every commit the base branch gained since to the PR under review
          # (a 6-file PR ratcheted 198 files after a big merge landed).
          # merge-base against the live branch scopes the diff to the PR.
          PR_BASE_REF: ${{ github.base_ref || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'develop' }}
        run: |
          BASE_FLAG=()
          ZEROS="0000000000000000000000000000000000000000"
          if [ -n "$PR_BASE_REF" ]; then
            BASE_FLAG=(--base "origin/${PR_BASE_REF}")
          elif [ -z "$GITHUB_EVENT_BEFORE" ] || [ "$GITHUB_EVENT_BEFORE" = "$ZEROS" ]; then
            # workflow_dispatch or first push of a new branch: ratchet
            # against the default branch instead of failing.
            BASE_FLAG=(--base "origin/${DEFAULT_BRANCH}")
          fi
          mapfile -t FILES < <(python3 scripts/ci/changed_source_files.py "${BASE_FLAG[@]}" --kind python)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files; nothing to ratchet."
            exit 0
          fi
          printf 'Ratcheting %d changed Python file(s)\n' "${#FILES[@]}"
          ruff check "${FILES[@]}"
          black --check "${FILES[@]}"
          isort --check-only "${FILES[@]}"
          # MyPy blocks ADDED files only: modified legacy files still carry
          # deep type debt (measured 529 errors across one 27-file sample),
          # covered by the advisory full-tree lane until it shrinks.
          # --follow-imports=silent keeps errors scoped to the listed files.
          # evals/ is excluded: those files are digest-pinned against recorded
          # trial evidence (evals/source-manifests/*.json), so an annotation
          # edit forced by this gate would invalidate a published baseline.
          mapfile -t ADDED < <(python3 scripts/ci/changed_source_files.py "${BASE_FLAG[@]}" --kind python-added | grep -v '^evals/' || true)
          if [ "${#ADDED[@]}" -gt 0 ]; then
            printf 'Type-checking %d added Python file(s)\n' "${#ADDED[@]}"
            # One file per run: mypy aborts the WHOLE batch with "Duplicate
            # module named X" when two added files share a basename outside a
            # package (e.g. two evals/*/environment/run_agent.py), which hides
            # every real error behind an unrelated packaging complaint.
            MYPY_FAILED=0
            for ADDED_FILE in "${ADDED[@]}"; do
              mypy --ignore-missing-imports --follow-imports=silent "$ADDED_FILE" || MYPY_FAILED=1
            done
            [ "$MYPY_FAILED" -eq 0 ]
          fi
      # Debt reached zero (full-tree reformat PR) — these two are now blocking
      # so it can't regrow. MyPy below stays advisory (type debt is not zero).
      - name: Full-tree Black (formatting check)
        run: black --check backend/src
      - name: Full-tree isort (import sorting)
        run: isort --check-only backend/src
      - name: Advisory full-tree MyPy (type checking)
        run: mypy backend/src --ignore-missing-imports
        continue-on-error: true # Advisory until full-tree debt reaches zero
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the quality ratchet diffs against the PR base
          # (or push `before`) via merge-base, which a shallow clone breaks.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run type check
        run: pnpm run type-check
      # Blocking ratchet: one full ESLint JSON run feeds the comparator,
      # which rejects errors/new warnings in changed files and any growth
      # of the global totals recorded in frontend/quality-baseline.json.
      # The tsconfig exclusion ratchet blocks new type-check debt the
      # same way. Untouched legacy debt stays visible in the advisory
      # lane below until it reaches zero.
      - name: Frontend quality ratchet (blocking)
        env:
          # Live base BRANCH, not the creation-time-frozen base.sha — see the
          # backend changed-file gate for the stale-base failure this fixes.
          PR_BASE_REF: ${{ github.base_ref || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'develop' }}
        run: |
          ZEROS="0000000000000000000000000000000000000000"
          if [ -n "$PR_BASE_REF" ]; then
            BASE="origin/${PR_BASE_REF}"
          elif [ -n "$GITHUB_EVENT_BEFORE" ] && [ "$GITHUB_EVENT_BEFORE" != "$ZEROS" ]; then
            BASE="$GITHUB_EVENT_BEFORE"
          else
            BASE="origin/${DEFAULT_BRANCH}"
          fi
          pnpm exec eslint app src --format json --output-file /tmp/eslint-report.json || true
          node ../scripts/ci/check_frontend_quality.mjs --report /tmp/eslint-report.json --base "$BASE"
          python3 ../scripts/ci/check_tsconfig_exclusions.py --base "$BASE"
      - name: Advisory full lint (human-readable)
        run: pnpm run lint
        continue-on-error: true # Advisory until full-tree debt reaches zero
  # ==========================================================================
  # Alembic Migration Guard (Fast - No DB, No App Deps)
  # ==========================================================================
  # Reads only the revision scripts via Alembic's ScriptDirectory (env.py is
  # never executed, no engine is created), so this needs nothing but Alembic
  # itself and runs in a few seconds. It enforces two invariants that have each
  # broken a deploy: exactly one migration head (divergent branches can't be
  # applied by `alembic upgrade head`) and revision ids <= 32 chars
  # (alembic_version.version_num is VARCHAR(32); a longer id crash-loops deploy).
  #
  # BLOCKING: the static guard above runs first with only Alembic installed and
  # never touches a DB (env.py is not executed). The targeted evidence delta
  # probe below is also BLOCKING: it establishes only the exact parent-state
  # precondition for evidence_prov_20260816, runs the real upgrade and
  # downgrade, and verifies both column contracts. It creates its own
  # generated scratch database so it cannot interfere with the advisory legacy
  # replay that follows. The legacy from-empty upgrade, `alembic check`, and
  # downgrade/upgrade smoke remain visible ADVISORY measurements because the
  # historical chain carries known bootstrap/create-migration debt. A failure
  # in an advisory measurement is always recorded as FAIL, never PASS.
  #
  # Why these steps need the FULL backend requirements (not just alembic): the
  # static guard reads only ScriptDirectory, but `alembic upgrade head` EXECUTES
  # backend/alembic/env.py, which imports src.models.base + the entire model
  # layer (and, in URL fallback, src.core.config.settings). env.py builds its DB
  # URL from SUPABASE_DB_URL or DATABASE_URL (get_url()), so the throwaway
  # service-container DATABASE_URL below is all the engine needs.
  migration-check:
    name: Alembic Migration Check
    runs-on: ubuntu-latest
    # Throwaway CI-local Postgres for the advisory execution probes. Credentials
    # are disposable (postgres/postgres) — no secrets, by design.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Alembic (pinned to backend requirement)
        run: pip install alembic==1.18.4
      # BLOCKING guard — unchanged. Runs before any DB work so a divergent-head
      # or over-long-revision-id defect fails the job regardless of the advisory
      # probes below (which cannot block).
      - name: Check single head + revision-id length
        working-directory: backend
        run: python ../scripts/ci/check_alembic.py
      # --- Targeted blocking probe plus advisory legacy-chain measurements ---
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      # env.py imports the full model layer at runtime, so `alembic upgrade head`
      # needs the same dependency set as the app. Advisory: a dependency hiccup
      # must never fail the blocking static guard that already ran above.
      - name: Install backend requirements (for execution probes)
        continue-on-error: true
        run: |
          set +e
          pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "- Install backend requirements (for probes): :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Install backend requirements (for probes): :x: FAIL (rc=$rc) — probes below are unreliable" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Blocking — evidence migration delta
        working-directory: .
        env:
          # The Python probe creates ci_evidence_delta_<pid>_<token> itself,
          # drops it in a finally block, and never runs the historical chain.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set +e
          echo "Running exact migration delta i9j0k1l2m3n4 -> evidence_prov_20260816 -> i9j0k1l2m3n4"
          echo "The probe owns and cleans a generated ci_evidence_delta_<pid>_<token> database."
          python scripts/ci/probe_evidence_migration.py \
            --admin-database-url "$DATABASE_URL"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "- Evidence migration delta (i9j0k1l2m3n4 ↔ evidence_prov_20260816): :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Evidence migration delta (i9j0k1l2m3n4 ↔ evidence_prov_20260816): :x: FAIL (rc=$rc) — BLOCKING" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Advisory — upgrade head from empty DB
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set +e
          alembic upgrade head
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "- Alembic upgrade head (from empty): :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Alembic upgrade head (from empty): :x: FAIL (rc=$rc) — advisory measurement only; legacy chain is not a blocking contract" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Advisory — alembic check (models vs migrations drift)
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set +e
          alembic check
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "- Alembic check (drift): :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Alembic check (drift): :x: FAIL (rc=$rc) — advisory, model/migration drift" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Advisory — downgrade -1 then upgrade head (round-trip smoke)
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set +e
          alembic downgrade -1 && alembic upgrade head
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "- Alembic downgrade -1 / upgrade head (round-trip): :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Alembic downgrade -1 / upgrade head (round-trip): :x: FAIL (rc=$rc) — advisory" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
  # ==========================================================================
  # Unit Tests (Fast - No External Dependencies)
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-xdist 'respx>=0.22.0,<0.23' hypothesis==6.112.2
          pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
      - name: Run unit tests
        run: |
          mkdir -p test-results
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "unit or not (integration or e2e or slow)" \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-fail-under=35 \
            --junitxml=test-results/unit.xml \
            -n auto \
            -v
        # Note: Coverage threshold set to 35% (gradual ramp from 20% to 70% target),
        # but CI selection differs slightly so we leave a buffer here and let
        # check_coverage_ratchet.py enforce the per-file floors below).
        # Per-file floors enforced by check_coverage_ratchet.py step below.
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"
          # Dummy Azure OpenAI creds — agent graph constructor refuses to
          # import without them. Unit tests mock real Azure calls, so any
          # syntactically-valid placeholder is enough.
          AZURE_OPENAI_CHAT_ENDPOINT: "https://example.invalid"
          AZURE_OPENAI_CHAT_API_KEY: "test-key-not-real"
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: "test-deployment"
          AZURE_OPENAI_CHAT_API_VERSION: "2024-02-01"
          AZURE_OPENAI_ENDPOINT: "https://example.invalid"
          AZURE_OPENAI_API_KEY: "test-key-not-real"
      - name: Run NOUS workflow contract tests
        run: |
          python3 -m pytest tests/unit/scripts/ \
            --confcutdir=tests/unit/scripts \
            -q --no-cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.xml
          flags: unit
          name: unit-tests
      - name: Upload test results to Codecov (unit)
        if: always()
        uses: ./.github/actions/codecov-test-results
        with:
          file: test-results/unit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check per-file coverage ratchet
        run: python backend/scripts/check_coverage_ratchet.py coverage.json
  # ==========================================================================
  # Golden Replay — deterministic, creds-free agent regression gate (B2)
  # ==========================================================================
  golden-replay:
    name: Golden Replay
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-xdist 'respx>=0.22.0,<0.23' hypothesis==6.112.2
          pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
      - name: Run golden replay (deterministic, no creds)
        # AGENT_GOLDEN_REPLAY swaps the real model for the cassette-seeded fake
        # at every LLM seam, so this runs offline with no Azure creds and no
        # nondeterminism. Cassette-vs-reality drift is caught weekly, live, by
        # agent-eval.yml. The staleness guard (test_eval_harness.py) fails if a
        # case lacks a cassette.
        run: |
          pytest backend/tests/eval/test_agent_regression.py \
            -c backend/pytest.ini \
            -m golden \
            -p no:cacheprovider \
            -v
        env:
          ENVIRONMENT: testing
          AGENT_GOLDEN_REPLAY: "1"
          DATABASE_URL: "sqlite:///:memory:"
          # Dummy Azure creds: the agent graph constructor requires them to
          # import, but every LLM seam is replaced by the replay fake, so no
          # real model call is ever made.
          AZURE_OPENAI_CHAT_ENDPOINT: "https://example.invalid"
          AZURE_OPENAI_CHAT_API_KEY: "test-key-not-real"
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: "test-deployment"
          AZURE_OPENAI_CHAT_API_VERSION: "2024-02-01"
          AZURE_OPENAI_ENDPOINT: "https://example.invalid"
          AZURE_OPENAI_API_KEY: "test-key-not-real"

  # ==========================================================================
  # OpenAPI Contract Ratchet (C5) — the FastAPI app is the single source of
  # truth for the REST contract. Regenerate the committed schema snapshot and
  # fail if it drifts from backend/openapi.json, forcing every contract change
  # to ship with regenerated frontend types (openapi-typescript) in the SAME PR
  # instead of silently diverging from the hand-mirrored types.
  # ==========================================================================
  openapi-contract:
    name: OpenAPI Contract Ratchet
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the advisory oasdiff step can resolve the PR base's
          # committed spec via `git show <base-sha>:backend/openapi.json`.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          # Same key as unit-tests: importing the app needs the full backend
          # requirement set, so the warm test wheel cache is reused here.
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      - name: Install backend dependencies
        run: pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
      - name: Verify OpenAPI snapshot is in sync with the app
        # Rebuilds app.openapi() offline (in-memory SQLite + placeholder Azure
        # creds — no DB/Redis/network) and diffs it against the committed
        # backend/openapi.json. On drift: `python scripts/ci/generate_openapi.py`
        # then `cd frontend && pnpm generate:api-types`, review + commit both.
        run: python scripts/ci/generate_openapi.py --check
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"
          # Dummy Azure creds — the agent-graph constructor refuses to import
          # without them; no real model call is made during schema generation.
          AZURE_OPENAI_CHAT_ENDPOINT: "https://example.invalid"
          AZURE_OPENAI_CHAT_API_KEY: "test-key-not-real"
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: "test-deployment"
          AZURE_OPENAI_CHAT_API_VERSION: "2024-02-01"
          AZURE_OPENAI_ENDPOINT: "https://example.invalid"
          AZURE_OPENAI_API_KEY: "test-key-not-real"
      # The TypeScript half of the contract: regenerate api.d.ts from the
      # (now-verified) snapshot and fail if EITHER committed artifact drifts.
      # Without this, backend/openapi.json could be regenerated while the
      # frontend types silently lag a contract change behind.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated TypeScript is in sync with the snapshot
        run: |
          pnpm --dir frontend generate:api-types
          git diff --exit-code -- backend/openapi.json frontend/src/types/generated/api.d.ts
      # Semantic-compatibility gate. The freshness diff above is blind to
      # compatibility: a breaking change that regenerates both committed
      # artifacts passes it. oasdiff compares the PR base's committed spec
      # against this branch's. Split into three steps: install+materialize,
      # a BLOCKING `breaking --fail-on ERR` gate, and an informational changelog.
      - name: Set up oasdiff and materialize base spec
        id: oasdiff
        if: github.event_name == 'pull_request'
        env:
          # Pinned oasdiff release + checksum. Do NOT `go install` at CI time and
          # do NOT pipe curl to a shell. Bump both together from
          # https://github.com/oasdiff/oasdiff/releases (checksums.txt).
          OASDIFF_VERSION: "1.23.0"
          OASDIFF_SHA256: "972b10535c3db4366b9dc3ebc11ca021279af3095267c3cffdca854a3a3c4f89"
          # Env indirection: never interpolate github.event.* into a run: block.
          # Live base BRANCH, not the creation-time-frozen base.sha: a stale
          # sha diffed the PR spec against an outdated base spec, flagging (or
          # masking) changes the base branch had already absorbed.
          PR_BASE_REF: ${{ github.base_ref || '' }}
        run: |
          set -euo pipefail
          tarball="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${tarball}"
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 "$url" -o "/tmp/${tarball}"
          echo "${OASDIFF_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp oasdiff
          if [ -z "${PR_BASE_REF}" ]; then
            echo "No PR base ref available; API compatibility gate skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "base_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Base spec as committed at the live base branch (fetch-depth: 0 makes it reachable).
          if ! git show "origin/${PR_BASE_REF}:backend/openapi.json" > /tmp/openapi-base.json 2>/dev/null; then
            echo "Base spec not present at origin/${PR_BASE_REF} (new file?); API compatibility gate skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "base_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_available=true" >> "$GITHUB_OUTPUT"
      # BLOCKING: ERR-level breaking changes fail the job. Escape hatch — a
      # reviewed, intentional break lands by labelling the PR
      # `api-breaking-approved`, which skips this gate (the changelog step below
      # still records what changed). A missing base spec is NOT a failure: the
      # step exits 0 with a summary note.
      - name: API breaking-change gate (oasdiff, ERR-level blocking)
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'api-breaking-approved')
        env:
          BASE_AVAILABLE: ${{ steps.oasdiff.outputs.base_available }}
        run: |
          set -euo pipefail
          if [ "${BASE_AVAILABLE}" != "true" ]; then
            echo "No base spec to compare; API breaking-change gate skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## API breaking-change gate (oasdiff, --fail-on ERR)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Capture oasdiff's exit code (ERR-level break => non-zero) through the
          # pipe so we can close the ``` fence before propagating. `|| rc=$?`
          # keeps `set -e` from aborting mid-fence; rc pre-set to 0 for success.
          rc=0
          /tmp/oasdiff breaking --fail-on ERR /tmp/openapi-base.json backend/openapi.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Propagate: non-zero here fails the step (and job) — this gate blocks.
          exit "${rc}"
      # Informational: full changelog into the job summary, never blocking.
      - name: API changelog (oasdiff, informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_AVAILABLE: ${{ steps.oasdiff.outputs.base_available }}
        run: |
          set -euo pipefail
          if [ "${BASE_AVAILABLE}" != "true" ]; then
            exit 0
          fi
          {
            echo "## API changelog (oasdiff)"
            echo '```'
            /tmp/oasdiff changelog /tmp/openapi-base.json backend/openapi.json 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install security tools
        run: pip install bandit==1.9.4 safety
      - name: Run Bandit (Python security)
        # Blocking on NEW findings only: with continue-on-error the
        # security-scan result consumed by Release Gate could never fail. The
        # baseline file pins the 16 pre-existing medium+ findings as tracked debt
        # (regenerate with: bandit -r backend/src -ll -ii -x tests -f json
        # -o backend/.bandit-baseline.json) — burn it down, never grow it.
        run: bandit -r backend/src -ll -ii -x tests -b backend/.bandit-baseline.json
      - name: Run Safety (dependency vulnerabilities)
        run: safety check -r backend/requirements.txt
        continue-on-error: true # Advisory only: flags unmaintained upstream packages we can't fix here
  # ==========================================================================
  # Frontend Tests
  # ==========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        # Vitest is the source of truth — `pnpm test` is `vitest run`.
        run: pnpm test:coverage
        env:
          CI: true
      - name: Check Ink terminal
        run: |
          pnpm --dir ../terminal type-check
          pnpm --dir ../terminal test
          python3 ../terminal/tests/migration-smoke.py
      # Blocking ratchet: global coverage may never fall below the floors
      # committed in frontend/quality-baseline.json ("coverage" key).
      # Raising or lowering a floor is an intentional, reviewed JSON edit.
      - name: Coverage ratchet (blocking)
        run: node ../scripts/ci/check_frontend_coverage.mjs coverage/coverage-summary.json
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-tests
      - name: Upload test results to Codecov (frontend)
        # vitest.config.mts emits coverage/junit-vitest.xml only under CI.
        if: always()
        uses: ./.github/actions/codecov-test-results
        with:
          file: frontend/coverage/junit-vitest.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
  # ==========================================================================
  # Integration Tests (Require Services)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
      - name: Run integration tests
        run: |
          mkdir -p test-results
          set +e
          pytest backend/tests/integration/ \
            -c backend/pytest.ini \
            -m "integration" \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/integration.xml \
            -v
          exit_code=$?
          set -e

          if [ "$exit_code" = "5" ]; then
            echo "No integration tests found - skipping"
            exit 0
          fi

          exit "$exit_code"
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"
          REDIS_URL: "redis://localhost:${{ job.services.redis.ports['6379'] }}/0"
      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.xml
          flags: integration
          name: integration-tests
      - name: Upload test results to Codecov (integration)
        if: always()
        uses: ./.github/actions/codecov-test-results
        with:
          file: test-results/integration.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
  # ==========================================================================
  # Resilience Tests
  # ==========================================================================
  resilience-tests:
    name: Resilience Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
      - name: Run resilience tests
        run: |
          mkdir -p test-results
          set +e
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "resilience" \
            --cov=backend/src/core \
            --cov-report=xml \
            --junitxml=test-results/resilience.xml \
            -v
          exit_code=$?
          set -e

          if [ "$exit_code" = "5" ]; then
            echo "No resilience tests found - skipping"
            exit 0
          fi

          exit "$exit_code"
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"
      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.xml
          flags: resilience
          name: resilience-tests
      - name: Upload test results to Codecov (resilience)
        if: always()
        uses: ./.github/actions/codecov-test-results
        with:
          file: test-results/resilience.xml
          flags: resilience
          token: ${{ secrets.CODECOV_TOKEN }}
  # ==========================================================================
  # E2E Tests (Full System)
  # ==========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Run on both push and PR, but use different test suites
    needs: [integration-tests]
    # Backend image build/cache export can take ~33 minutes on a cold runner;
    # leave enough time for infrastructure startup and the actual Playwright run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /var/lib/snapd || true
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          docker system prune -af --volumes || true
          df -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      # build-push-action with load:true puts the image in the local daemon so
      # the docker-compose run below can use it. type=gha persists BuildKit
      # layers across runs (content-addressed → lockfile changes invalidate the
      # right layers). Distinct scopes keep the two images' caches separate.
      # The `docker system prune` above only clears the local daemon, not the
      # remote GHA store, so it does not defeat this.
      - name: Generate CI Supabase JWTs
        id: supabase-jwts
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os

          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def jwt_for(role):
              header = {"alg": "HS256", "typ": "JWT"}
              payload = {
                  "role": role,
                  "iss": "supabase-demo",
                  "iat": 0,
                  "exp": 9999999999,
              }
              header_part = b64url(json.dumps(header, separators=(",", ":")).encode())
              payload_part = b64url(json.dumps(payload, separators=(",", ":")).encode())
              signing_input = f"{header_part}.{payload_part}"
              signature = hmac.new(
                  os.environ["SUPABASE_JWT_SECRET"].encode(),
                  signing_input.encode(),
                  hashlib.sha256,
              ).digest()
              return f"{signing_input}.{b64url(signature)}"

          anon = jwt_for("anon")
          service_role = jwt_for("service_role")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"anon={anon}\n")
              out.write(f"service_role={service_role}\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"NEXT_PUBLIC_SUPABASE_ANON_KEY={anon}\n")
              env.write(f"SERVICE_ROLE_JWT={service_role}\n")
          PY
      - name: Build backend image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          load: true
          tags: rag-backend:test
          build-args: |
            PYTHON_VERSION=3.11
            TORCH_CPU_ONLY=true
          cache-from: type=gha,scope=backend-e2e
          cache-to: type=gha,scope=backend-e2e,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          load: true
          tags: rag-frontend:test
          # BACKEND_URL must be a BUILD arg: Next resolves rewrites() at build
          # time into routes-manifest.json, so the `-e BACKEND_URL` on the
          # `docker run` below is never consulted. Left unset here,
          # resolveBackendUrl() fell back to http://localhost:8000 — inside the
          # frontend container that is the container itself, so every
          # /api/v2/* proxy hop answered a plain-text 500 "Internal Server
          # Error". That blanked the chat surface (initError) and failed the
          # three chat E2E specs on every develop push.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.supabase-jwts.outputs.anon }}
            NEXT_PUBLIC_STATSIG_CLIENT_KEY=client-SEfCB81zQnvSAqRxfVi1nJNRmpJtrmOrvDKQPQm4UBx
            NEXT_PUBLIC_AUTH_COOKIE_NAME=sb-nous-e2e
            BACKEND_URL=http://backend:8000
          cache-from: type=gha,scope=frontend-e2e
          cache-to: type=gha,scope=frontend-e2e,mode=max
      - name: Start infrastructure services
        run: |
          # Start infrastructure services (not backend/frontend, they start separately)
          docker compose -p rag_system -f docker-compose.ci.yml up -d postgres redis neo4j qdrant gotrue auth-proxy

          # Wait for services with working healthchecks to become healthy
          # Note: qdrant and gotrue use distroless images, so their healthchecks
          # fail. We gate on postgres, redis, neo4j (3 healthy) then poll the rest.
          echo "Waiting for core services with healthchecks..."
          SECONDS=0
          healthy_count() {
            docker compose -p rag_system -f docker-compose.ci.yml ps --format json 2>/dev/null \
              | grep -c '"healthy"' || true
          }
          while (( $(healthy_count) < 3 )); do
            if (( SECONDS > 300 )); then
              echo "::error::Timed out after 300s waiting for core services"
              docker compose -p rag_system -f docker-compose.ci.yml ps
              exit 124
            fi
            if (( SECONDS % 30 == 0 )); then
              echo "  ${SECONDS}s — $(healthy_count)/3 healthy"
              docker compose -p rag_system -f docker-compose.ci.yml ps --format "table {{.Name}}\t{{.Status}}" 2>/dev/null || true
            fi
            sleep 5
          done
          echo "Core services healthy (${SECONDS}s)"

          # Poll distroless services from host (they have no shell inside)
          for probe in "qdrant=http://localhost:6333/healthz" "gotrue=http://localhost:9999/health" "auth-proxy=http://localhost:8999/health"; do
            name="${probe%%=*}"; url="${probe#*=}"
            echo "Waiting for ${name} at ${url} ..."
            t=0
            until curl -sf "$url" >/dev/null 2>&1; do
              if (( t > 120 )); then
                echo "::error::Timed out after 120s waiting for ${name}"
                docker compose -p rag_system -f docker-compose.ci.yml logs "$name" --tail=50 || true
                exit 124
              fi
              t=$((t+3)); sleep 3
            done
            echo "${name} ready (${t}s)"
          done
          echo "All infrastructure services ready"
      - name: Start application services
        run: |
          # Start backend with pre-built image
          docker run -d --name backend-e2e \
            --network rag_system_ci-network \
            --network-alias backend \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql://test:test@postgres:5432/test_db \
            -e REDIS_URL=redis://redis:6379/0 \
            -e NEO4J_URI=bolt://neo4j:7687 \
            -e NEO4J_USERNAME=neo4j \
            -e NEO4J_PASSWORD= \
            -e NEO4J_AUTH_DISABLED=true \
            -e QDRANT_URL=http://qdrant:6333 \
            -e ENVIRONMENT=testing \
            -e SECRET_KEY=ci-test-secret-key-32-characters! \
            -e JWT_SECRET_KEY=ci-test-jwt-secret-key-32chars! \
            -e SUPABASE_URL=http://gotrue:9999 \
            -e SUPABASE_JWT_SECRET=ci-test-supabase-jwt-secret-not-for-prod-use \
            -e ENCRYPTION_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e CORS_ORIGINS=http://localhost:3000,http://frontend:3000 \
            -e TRUSTED_HOSTS=localhost,127.0.0.1,testserver,backend,frontend \
            -e ENABLE_AI_PROCESSING=false \
            -e SEED_ADMIN_PASSWORD=admin123 \
            -e SEED_DEMO_PASSWORD=demo123 \
            -e SEED_LAB_ADMIN_PASSWORD=admin123 \
            rag-backend:test

          # Start frontend with pre-built image
          docker run -d --name frontend-e2e \
            --network rag_system_ci-network \
            --network-alias frontend \
            -p 3000:3000 \
            -e BACKEND_URL=http://backend:8000 \
            -e NEXT_PUBLIC_API_URL=http://localhost:8000 \
            -e SUPABASE_SERVER_URL=http://auth-proxy \
            rag-frontend:test

          # Wait for services to be ready
          echo "Waiting for application services..."
          for attempt in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy on attempt $attempt"
              break
            fi
            sleep 3
          done

          for attempt in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is healthy on attempt $attempt"
              break
            fi
            sleep 3
          done
      - name: Verify services are accessible
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:8000/health || exit 1
          echo "Checking frontend..."
          curl -f http://localhost:3000 || exit 1
          echo "Checking gotrue..."
          curl -f http://localhost:9999/health || exit 1
          curl -f http://localhost:8999/health || exit 1
      - name: Initialize and seed test database
        run: |
          docker exec \
            -e PYTHONPATH=/app \
            backend-e2e \
            python -c "
          from src.core.encryption import EncryptionKeyType, get_key_manager, initialize_encryption
          initialize_encryption()
          km = get_key_manager()
          if km.get_active_key(EncryptionKeyType.DATA) is None:
              km.generate_key(EncryptionKeyType.DATA)
          from src.core.database import create_tables, init_database
          create_tables()
          init_database()
          "
      - name: Mirror seeded users into gotrue
        run: |
          docker exec \
            -e PYTHONPATH=/app \
            -e SERVICE_ROLE_JWT=$SERVICE_ROLE_JWT \
            backend-e2e \
            python -c "
          import os, httpx
          from src.core.database import SessionLocal
          from src.models.user import User

          PASSWORDS = {
              'admin@multimodal-rag.com': 'admin123',
              'demo@multimodal-rag.com': 'demo123',
              'lab-admin@multimodal-rag.com': 'admin123',
          }
          headers = {'Authorization': f\"Bearer {os.environ['SERVICE_ROLE_JWT']}\"}
          # GoTrue v2.151 IGNORES a client-supplied id on /admin/users and
          # generates its own UUID, so the original same-id plan never held:
          # the JWT sub matched no app user, get_current_user fell into the
          # auto-provisioning INSERT, and that died on EncryptedString columns
          # (no active DATA key in the server process) -> /auth/me 500s.
          # Instead, adopt gotrue's generated id as the app user's id — the
          # users were seeded moments ago on a fresh DB and have no dependent
          # rows, so the primary-key update is safe.
          import uuid as _uuid
          with SessionLocal() as db:
              users = db.query(User).filter(User.email.in_(list(PASSWORDS))).all()
              assert len(users) == len(PASSWORDS), f'expected {len(PASSWORDS)} seeded users, got {len(users)}'
              for u in users:
                  payload = {
                      'email': u.email,
                      'password': PASSWORDS[u.email],
                      'email_confirm': True,
                  }
                  r = httpx.post('http://gotrue:9999/admin/users', headers=headers, json=payload, timeout=10.0)
                  print(f'gotrue seed {u.email} -> {r.status_code}')
                  if r.status_code >= 400:
                      print(r.text)
                      r.raise_for_status()
                  gid = _uuid.UUID(r.json()['id'])
                  if gid != u.id:
                      db.query(User).filter(User.id == u.id).update({User.id: gid})
                      print(f'  app user id {u.id} -> {gid} (adopted gotrue id)')
              db.commit()
          "
      - name: Set up pnpm for Playwright
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js for Playwright
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          # Key on pnpm-lock.yaml so browser cache invalidates when the locked
          # @playwright/test/playwright version changes.
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright dependencies
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-mintimeout 20000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm install --frozen-lockfile --filter ./tests/e2e
          # Always run `playwright install` — do NOT gate it on the cache-hit.
          # The locked workspace install keeps @playwright/test and the browser
          # cache in sync; this command is a no-op when the matching browser is
          # cached and re-downloads only on drift. --with-deps also installs OS
          # libs (libnss/libatk/libgbm) absent on a fresh runner.
          # Hosted runners also preload unrelated packages.microsoft.com apt
          # sources. Quarantine those ephemeral-runner sources so their outages
          # cannot make Playwright's Ubuntu dependency update fail.
          sudo python3 scripts/ci/quarantine_apt_sources.py
          pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Run E2E Tests
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8000
          TEST_ADMIN_EMAIL: admin@multimodal-rag.com
          TEST_ADMIN_PASSWORD: admin123
          TEST_USER_EMAIL: demo@multimodal-rag.com
          TEST_USER_PASSWORD: demo123
          TEST_ORG_ADMIN_EMAIL: lab-admin@multimodal-rag.com
          TEST_ORG_ADMIN_PASSWORD: admin123
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Running smoke tests for PR..."
            pnpm --dir tests/e2e exec playwright test --grep "@smoke" --project=chromium --reporter=html,github
          else
            echo "Running full E2E tests..."
            # --max-failures: a systemic failure (stack misconfig, dead
            # selector everywhere) exits fast and REPORTS instead of burning
            # the whole job budget and getting killed as "cancelled".
            pnpm --dir tests/e2e exec playwright test --project=chromium --reporter=html,github --max-failures=15
          fi
      - name: Upload E2E test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker logs backend-e2e --tail=100 2>&1 || true
          echo ""
          echo "=== Frontend Logs ==="
          docker logs frontend-e2e --tail=100 2>&1 || true
          echo ""
          # GoTrue logs the SQL error behind opaque 500s like "Database error
          # checking email" (seen from the seed-mirror step) only to its own
          # stdout — without this dump those failures are undiagnosable.
          echo "=== GoTrue Logs ==="
          docker logs rag_system-gotrue-1 --tail=100 2>&1 || true
          echo ""
          echo "=== Postgres Logs ==="
          docker logs rag_system-postgres-1 --tail=60 2>&1 || true
          echo ""
          echo "=== auth schema contents ==="
          docker exec rag_system-postgres-1 psql -U test -d test_db -c '\dt auth.*' 2>&1 || true
          echo ""
          echo "=== Docker Compose Status ==="
          docker compose -p rag_system -f docker-compose.ci.yml ps
      - name: Cleanup
        if: always()
        run: |
          docker stop backend-e2e frontend-e2e 2>/dev/null || true
          docker rm backend-e2e frontend-e2e 2>/dev/null || true
          docker compose -p rag_system -f docker-compose.ci.yml down -v --remove-orphans
  # ==========================================================================
  # Performance Tests (Main Branch Only)
  # ==========================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    continue-on-error: true # Non-critical in PR checks; don't block merges
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432/tcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt', 'backend/constraints-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-benchmark locust
          pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt
      - name: Run performance tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "slow or scalability" \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            -v
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"
      - name: Store benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: benchmark.json
  # ==========================================================================
  # Fail-closed release authority
  # ==========================================================================
  test-summary:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - migration-check
      - openapi-contract
      - unit-tests
      - golden-replay
      - integration-tests
      - resilience-tests
      - frontend-tests
      - security-scan
      - e2e-tests
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact success from every blocking job
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci/assert_required_jobs.py \
            --summary-file "$GITHUB_STEP_SUMMARY"
