name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Trigger phrase AND trusted commenter. issue_comment runs in base-repo
    # context with secrets even when the comment comes from a fork-PR author,
    # so gating on the phrase alone let any GitHub user exfiltrate
    # OPENCODE_API_KEY / mint OIDC tokens by commenting `/oc` (R5-H8).
    if: |
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      # Required: `use_github_token` defaults to "false", so `opencode github
      # run` mints an OIDC token and exchanges it with the OpenCode App for a
      # repo token. Verified against github/action.yml at the pinned SHA.
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        # SHA-pinned (v1.18.18): @latest is a mutable tag the vendor controls;
        # with secrets in env, a tag hijack is remote code execution here.
        uses: anomalyco/opencode/github@7673ed6bd6547ee0dcb81aab55f1392fb751d652 # v2.0.8
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-pro
