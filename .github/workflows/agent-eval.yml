name: Agent Regression Eval

# Runs the LangSmith golden-set sweep against the compiled agent graph.
# Scheduled weekly + manual dispatch. Self-hosted runner so the backend
# stack (Postgres, Redis, Neo4j) is reachable.

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      experiment_prefix:
        description: "LangSmith experiment prefix (default: agent-regression)"
        required: false
        default: "agent-regression"

permissions:
  contents: read

jobs:
  eval:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      LANGCHAIN_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "false"
      AGENT_EVAL_DATASET_NAME: agent-accuracy-benchmark
      # workflow_dispatch input passed via env to avoid command injection
      INPUT_EXPERIMENT_PREFIX: ${{ inputs.experiment_prefix }}
      AZURE_OPENAI_CHAT_ENDPOINT: ${{ secrets.AZURE_OPENAI_CHAT_ENDPOINT }}
      AZURE_OPENAI_CHAT_API_KEY: ${{ secrets.AZURE_OPENAI_CHAT_API_KEY }}
      AZURE_OPENAI_CHAT_API_VERSION: ${{ secrets.AZURE_OPENAI_CHAT_API_VERSION }}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
      AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_ENDPOINT: ${{ secrets.AZURE_OPENAI_EMBEDDING_ENDPOINT }}
      AZURE_OPENAI_EMBEDDING_API_KEY: ${{ secrets.AZURE_OPENAI_EMBEDDING_API_KEY }}
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      NEO4J_URI: ${{ secrets.EVAL_NEO4J_URI }}
      NEO4J_USER: ${{ secrets.EVAL_NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.EVAL_NEO4J_PASSWORD }}
      REDIS_URL: ${{ secrets.EVAL_REDIS_URL }}
      DO_KB_ENABLED: "true"
      DO_API_TOKEN: ${{ secrets.EVAL_DO_API_TOKEN }}
      DO_KB_REGION: ${{ secrets.EVAL_DO_KB_REGION }}
      DO_KB_PROJECT_ID: ${{ secrets.EVAL_DO_KB_PROJECT_ID }}
      DO_KB_EMBEDDING_MODEL_UUID: ${{ secrets.EVAL_DO_KB_EMBEDDING_MODEL_UUID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Resolve experiment prefix
        run: |
          PREFIX="${INPUT_EXPERIMENT_PREFIX:-agent-regression}"
          # Defensive sanitization: keep only [A-Za-z0-9_-] characters
          PREFIX="$(printf '%s' "$PREFIX" | tr -cd 'A-Za-z0-9_-')"
          if [ -z "$PREFIX" ]; then PREFIX="agent-regression"; fi
          echo "AGENT_EVAL_EXPERIMENT_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # actions/cache `path` is workspace-relative (it ignores the job's
      # working-directory: backend), hence backend/.venv. Cache restore runs
      # AFTER checkout's clean, so the restored venv survives. On a hit the
      # `if [ ! -d .venv ]` guard skips the rebuild and pip finds everything
      # already satisfied — the ~49-package ML tree is no longer re-downloaded.
      - name: Cache pip + venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/pip
            backend/.venv
          key: ${{ runner.os }}-pip-eval-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-eval-
            ${{ runner.os }}-pip-
      - name: Ensure venv
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install -q -r requirements.txt

      # Regenerate the remote dataset from golden_examples.py EVERY run so it
      # can never drift (upsert + delete orphans). This is what prevents the
      # silent-contract-mismatch class of failure: the dataset always mirrors
      # the committed golden cases. Blocking — a sync failure fails the job.
      - name: Sync golden dataset
        run: |
          .venv/bin/python -m tests.eval.upload_golden --clean

      # Blocking gate: pytest's non-zero exit fails the job (no
      # continue-on-error). Runs BOTH the remote-dataset sweep
      # (test_agent_regression_against_dataset) and the deterministic local
      # golden cases (test_local_golden_case). Online trajectory evaluators
      # (incl. plan_adherence) are registered separately via
      # `python tests/eval/upload_trajectory_rules.py` after evaluator changes.
      - name: Run regression sweep
        # `langsmith or golden`: the remote-dataset sweep AND the local golden
        # cases run LIVE here. The golden cases are the weekly drift backstop
        # for the committed replay cassettes — if a cassette no longer matches
        # live model behavior, this job goes red. (Per-PR the golden cases run
        # creds-free via AGENT_GOLDEN_REPLAY in test-pipeline.yml.)
        run: |
          .venv/bin/pytest -m "langsmith or golden" tests/eval/test_agent_regression.py -v --tb=short

      - name: Summary on failure
        if: failure()
        run: |
          echo "::error::Agent regression failed. Inspect experiment in LangSmith:"
          echo "Dataset: $AGENT_EVAL_DATASET_NAME"
          echo "Prefix:  $AGENT_EVAL_EXPERIMENT_PREFIX"
