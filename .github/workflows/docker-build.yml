name: Docker Build

# Reusable build step: called by release-dev.yml on green develop pipelines,
# and manually dispatchable as a diagnostics path. Never self-triggers.
on:
  workflow_call:
    inputs:
      source_sha:
        description: "Full source commit SHA to check out and build"
        required: true
        type: string
    secrets:
      # TODO(cutover): DO Spaces creds only feed the BuildKit s3 build cache
      # (SPACES_* below). Replace with an S3 cache bucket, then drop these.
      DO_SPACES_ACCESS_KEY:
        required: true
      DO_SPACES_SECRET_KEY:
        required: true
    outputs:
      source_sha:
        description: "The exact source commit that was built"
        value: ${{ jobs.build-backend.outputs.source_sha }}
      image_tag:
        description: "The full-SHA backend trace tag"
        value: ${{ jobs.build-backend.outputs.image_tag }}
      digest:
        description: "The registry digest returned by BuildKit"
        value: ${{ jobs.build-backend.outputs.digest }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full source commit SHA to check out and build"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: 267685730035.dkr.ecr.us-east-1.amazonaws.com
  SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
  SPACES_BUCKET: rag-system-storage
  SPACES_REGION: nyc3

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write enables GitHub OIDC -> AWS STS (no static keys).
    permissions:
      id-token: write
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
      digest: ${{ steps.verify-image.outputs.digest }}

    steps:
      - name: Validate requested source identity
        id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi

          IMAGE_TAG="$REGISTRY/nous/backend:$SOURCE_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checked-out source identity
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $SOURCE_SHA"
            exit 1
          fi

      # The torch-bearing backend image plus BuildKit layer export runs the
      # hosted-runner disk to ENOSPC. Drop preinstalled toolchains we do not use.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::267685730035:role/nous-github-ecr-push
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: true

      - name: Build and push exact backend image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.identity.outputs.image_tag }}
          build-args: |
            PYTHON_VERSION=3.11
            TORCH_CPU_ONLY=true
            GIT_SHA=${{ steps.identity.outputs.source_sha }}
          cache-from: type=s3,bucket=${{ env.SPACES_BUCKET }},region=${{ env.SPACES_REGION }},endpoint_url=${{ env.SPACES_ENDPOINT }},prefix=buildcache/backend/
          cache-to: type=s3,bucket=${{ env.SPACES_BUCKET }},region=${{ env.SPACES_REGION }},endpoint_url=${{ env.SPACES_ENDPOINT }},prefix=buildcache/backend/,mode=max
        # Deliberate step-level AWS credential override: these static DO
        # Spaces keys feed ONLY the BuildKit s3 cache backend above (the
        # registry push itself uses the OIDC role from configure-aws-
        # credentials). Do not remove — buildx loses cache access without
        # them until the s3 cache migrates to an S3 bucket.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}

      - name: Verify registry digest evidence
        id: verify-image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid registry digest: $DIGEST"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Build"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Trivy remains disabled because the previously pinned upstream action
      # no longer resolves. Re-enable only with a reviewed immutable action pin.
