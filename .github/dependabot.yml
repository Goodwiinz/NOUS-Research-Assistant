version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # assistant-ui ships breaking changes in 0.x minors, and the web app
      # (React 18) and the Ink terminal (React 19) both depend on it. Under
      # node-linker=hoisted a shared @assistant-ui/core version collapses to
      # ONE copy carrying one React, which broke the 66-package group PR
      # #2083 (type-check plus "Objects are not valid as a React child" in
      # the chat tests). Keep it in its own PR so the rest of the group can land.
      # Dependabot puts each dependency in the FIRST group that matches.
      assistant-ui:
        patterns:
          - "@assistant-ui/*"
          - "assistant-stream"
          - "assistant-cloud"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # No pip-major group: 28 majors bundled in one PR (#2055) cannot land as a
    # unit. Without a group, each major bump opens its own PR.
    ignore:
      # numpy 2.5+ requires Python >=3.12; CI and Dockerfile.prod run 3.11.
      # Drop this once the backend moves to Python 3.12.
      - dependency-name: "numpy"
        versions: [">=2.5"]

  - package-ecosystem: "docker"
    directory: "/backend/docker"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
