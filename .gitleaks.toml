title = "RAG System Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "digitalocean-api-token"
description = "DigitalOcean API token"
regex = '''dop_v1_[a-f0-9]{64}'''
secretGroup = 0
keywords = ["dop_v1_"]
tags = ["digitalocean", "api-token", "pre-public-critical"]

[[rules]]
id = "digitalocean-spaces-credential"
description = "DigitalOcean Spaces access key or secret in configuration"
regex = '''(?i)(?:digitalocean|spaces|s3|aws|do)[A-Z0-9_\-]*(?:access|secret)[A-Z0-9_\-]*(?:key|id)?\s*[:=]\s*["']([A-Za-z0-9/+=]{20,128})["']'''
secretGroup = 1
keywords = ["spaces", "s3", "access", "secret"]
tags = ["digitalocean", "spaces", "pre-public-critical"]

[[rules]]
id = "avns-database-password"
description = "DigitalOcean managed database AVNS password"
regex = '''AVNS_[A-Za-z0-9_-]{20,}'''
secretGroup = 0
keywords = ["AVNS_"]
tags = ["database", "digitalocean", "pre-public-critical"]

[[rules]]
id = "kubernetes-admin-credential"
description = "Kubernetes kubeconfig bearer token or client credential"
regex = '''(?i)(?:token|client-key-data|client-certificate-data)\s*:\s*([A-Za-z0-9+/_=-]{80,})'''
secretGroup = 1
keywords = ["client-key-data", "client-certificate-data", "token:"]
tags = ["kubernetes", "pre-public-critical"]

[allowlist]
description = "Ignore generated dependencies, local outputs, and non-secret examples"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.worktrees/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)coverage/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
  '''(^|/)scripts/data/arxiv/''',
  '''(^|/)infrastructure/terraform/terraform\.tfvars\.example$''',
  # Eval fixtures carry synthetic secret-shaped strings by design (redaction tests)
  '''(^|/)evals/[^/]+/tests/.*\.json$''',
  # R8 live evidence (GOO-319/320): the sealed search-delta export has
  # current_version_key / baseline_version_key fields that hold SHA-256 hashes of
  # provider source versions, not credentials. Only this run's retained JSON.
  '''(^|/)docs/audits/2026-10-04-live-evidence-r8/[^/]+\.json$''',
]
