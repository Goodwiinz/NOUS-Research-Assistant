      <g fill="#FDF6E3" opacity=".2"><circle cx="15" cy="11" r=".8"/><circle cx="3" cy="21" r=".5"/></g>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
