  <title id="title">A quiet place to understand</title>
  <desc id="desc">A researcher seen from behind reads at a desk beside a tall sunlit window. Gold bookshelves and parchment light evoke a warm reading room, rendered in flat risograph shapes. The lower left is dark and open for an editorial headline.</desc>
