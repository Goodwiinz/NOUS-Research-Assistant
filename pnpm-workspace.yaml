packages:
  - frontend
  - tests/e2e
  - terminal
  - packages/chat-runtime

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  next: 16.2.11
  # Keep the web app on React 18; the Ink terminal owns React 19.
  multimodal-rag-frontend>react: 18.3.1
  multimodal-rag-frontend>react-dom: 18.3.1
  # Security pins use this workspace-level map as the sole pnpm authority.
  '@isaacs/brace-expansion': '^5.0.1'
  '@modelcontextprotocol/sdk': '^1.26.0'
  '@opentelemetry/core': 2.10.0
  '@trigger.dev/core': 4.5.6
  # Scoped per major: minimatch@10 needs brace-expansion@^5, so a blanket v1 pin
  # downgrades it and its CJS `expand` named export disappears.
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  cookie: 0.7.2
  dompurify: 3.4.13
  engine.io: 6.6.7
  form-data: 4.0.6
  hono: 4.12.34
  js-yaml: 4.3.1
  jsonpath: '^1.2.0'
  nanoid: 3.3.18
  postcss: 8.5.23
  protobufjs: 7.6.5
  sharp: 0.35.0
  socket.io-parser: 4.2.7
  systeminformation: 5.31.7
  tmp: 0.2.7
  uuid: 11.1.1
  ws: 8.21.0
  # Security (dev test-toolchain): the vitest 3 bump pulls vite, but pnpm kept
  # vite 5.4.21 (range already satisfied) which still carries the high-sev
  # `server.fs.deny` advisory (only patched in >=6.4.3). Force vite 6 + the
  # esbuild patch so the vitest/vite/esbuild cluster is fully clear.
  # vite 6.x only: >=6.4.3 clears the advisory; capped <7 to stay inside
  # vitest 3.2.6's supported peer range (^5 || ^6 || ^7) and avoid vite 8.
  vite: '^6.4.3'
  esbuild: '>=0.28.1'
