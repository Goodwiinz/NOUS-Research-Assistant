version: "3.8"

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    ports:
      - "8000:8000"
      - "8002:8002"
    environment:
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

      # Vector Database Configuration (supports both local and cloud)

      # Application Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # WARNING: Set JWT_SECRET_KEY in .env for production! Default is for development only.
      # Generate with: openssl rand -base64 32
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}

      # AI Service Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # DeepEval / Confident AI Configuration
      - CONFIDENT_API_KEY=${CONFIDENT_API_KEY:-}

      # Azure OpenAI Configuration
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_CHAT_DEPLOYMENT_NAME=${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT=${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT:-gpt-5.6-luna}

      # Azure OpenAI Multi-Endpoint Configuration
      - AZURE_OPENAI_CHAT_ENDPOINT=${AZURE_OPENAI_CHAT_ENDPOINT:-}
      - AZURE_OPENAI_EMBEDDING_ENDPOINT=${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
      - AZURE_OPENAI_CHAT_API_VERSION=${AZURE_OPENAI_CHAT_API_VERSION:-2024-06-01}
      - AZURE_OPENAI_EMBEDDING_API_VERSION=${AZURE_OPENAI_EMBEDDING_API_VERSION:-2023-05-15}

      # Separate API Keys Support
      - AZURE_OPENAI_CHAT_API_KEY=${AZURE_OPENAI_CHAT_API_KEY:-}
      - AZURE_OPENAI_EMBEDDING_API_KEY=${AZURE_OPENAI_EMBEDDING_API_KEY:-}

      # Cohere Reranking Configuration
      - COHERE_RERANK_ENDPOINT=${COHERE_RERANK_ENDPOINT:-}
      - COHERE_RERANK_API_KEY=${COHERE_RERANK_API_KEY:-}
      - COHERE_RERANK_MODEL=${COHERE_RERANK_MODEL:-}

      # LangSmith / LangGraph Tracing
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-rag-agent}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      # Performance Configuration
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - LLM_CACHE_TTL_SECONDS=${LLM_CACHE_TTL_SECONDS:-3600}

      # Supabase Configuration
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_STORAGE_ENABLED=${SUPABASE_STORAGE_ENABLED:-false}
      - SUPABASE_STORAGE_TEMP_DIR=/tmp/rag_storage
    command: >-
      sh -lc "python -m pip show langgraph >/dev/null 2>&1 ||
      python -m pip install --no-cache-dir 'langgraph>=0.4,<2.0' &&
      exec uvicorn src.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    environment:
      # Backend URL for Next.js server-side rewrites (uses Docker service name)
      - BACKEND_URL=http://backend:8000
      # Public API URL for client-side requests (uses localhost for browser access)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENVIRONMENT=development
      - REACT_APP_ENABLE_DEBUG=true
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./frontend:/app/frontend
      - frontend_root_node_modules:/app/node_modules
      - frontend_workspace_node_modules:/app/frontend/node_modules
      - frontend_next_cache:/app/frontend/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g

  # PostgreSQL Database — COMMENTED OUT: Supabase CLI now manages PostgreSQL.
  # To revert, uncomment this block and update DATABASE_URL back to postgres:5432.
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_DB=multimodal_rag_dev
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
  #   volumes:
  #     - postgres_dev_data:/var/lib/postgresql/data
  #     # Disabled - using alembic migrations instead
  #     # - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql
  #     # - ../../database/dev-seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - multimodal-rag-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --timeout 300 --tcp-keepalive 60
    volumes:
      - redis_dev_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Neo4j Knowledge Graph
  neo4j:
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_initial_dbms_default__database=neo4j
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - neo4j_dev_data:/data
      - neo4j_dev_logs:/logs
      - neo4j_dev_import:/var/lib/neo4j/import
      - neo4j_dev_plugins:/plugins
    ports:
      - "127.0.0.1:7474:7474" # HTTP
      - "127.0.0.1:7687:7687" # Bolt
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  # Celery Worker
  celery-worker:
    container_name: rag-celery-worker-dev
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    command: celery -A src.tasks.celery_app worker --loglevel=debug --concurrency=${WORKER_CONCURRENCY:-4} --hostname=worker@rag-celery-worker-dev --queues=celery,document_processing,text_processing,vector_processing,entity_processing,graph_processing
    environment:
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

      # Vector Database Configuration (supports both local and cloud)

      # Application Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - UPLOAD_DIR=/app/uploads

      # AI Service Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # DeepEval / Confident AI Configuration
      - CONFIDENT_API_KEY=${CONFIDENT_API_KEY:-}

      # Azure OpenAI Configuration
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_CHAT_DEPLOYMENT_NAME=${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT=${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT:-gpt-5.6-luna}

      # Azure OpenAI Multi-Endpoint Configuration
      - AZURE_OPENAI_CHAT_ENDPOINT=${AZURE_OPENAI_CHAT_ENDPOINT:-}
      - AZURE_OPENAI_EMBEDDING_ENDPOINT=${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
      - AZURE_OPENAI_CHAT_API_VERSION=${AZURE_OPENAI_CHAT_API_VERSION:-2024-06-01}
      - AZURE_OPENAI_EMBEDDING_API_VERSION=${AZURE_OPENAI_EMBEDDING_API_VERSION:-2023-05-15}

      # Separate API Keys Support
      - AZURE_OPENAI_CHAT_API_KEY=${AZURE_OPENAI_CHAT_API_KEY:-}
      - AZURE_OPENAI_EMBEDDING_API_KEY=${AZURE_OPENAI_EMBEDDING_API_KEY:-}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      # Performance Configuration
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - LLM_CACHE_TTL_SECONDS=${LLM_CACHE_TTL_SECONDS:-3600}

      # Supabase Storage Configuration
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_ENABLED=${SUPABASE_STORAGE_ENABLED:-false}
      - SUPABASE_STORAGE_TEMP_DIR=/tmp/rag_storage
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    command: celery -A src.tasks.celery_app beat --loglevel=debug
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
      - celerybeat_dev_data:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # Flower for Celery Monitoring
  flower:
    container_name: rag-flower-dev
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    command: python -m celery --broker=redis://redis:6379/0 -A src.tasks.celery_app flower --port=5555 --max_tasks=10000 --purge_offline_workers=60 --basic_auth=${FLOWER_USER:-dev}:${FLOWER_PASSWORD:-dev-only-flower}
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - flower_data:/data
    depends_on:
      - redis
      - celery-worker
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-dev-only-insecure-minio}
    volumes:
      - minio_dev_data:/data
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Development Tools
  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=host.docker.internal
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - multimodal-rag-network
    restart: unless-stopped

volumes:
  # postgres_dev_data:  # Commented out — Supabase manages PostgreSQL now
  frontend_root_node_modules:
  frontend_workspace_node_modules:
  frontend_next_cache:
  redis_dev_data:
  neo4j_dev_data:
  neo4j_dev_logs:
  neo4j_dev_import:
  neo4j_dev_plugins:
  celerybeat_dev_data:
  minio_dev_data:
  flower_data:

networks:
  multimodal-rag-network:
    driver: bridge
