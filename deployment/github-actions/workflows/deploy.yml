# ARCHIVED REFERENCE — not executed by GitHub (not under .github/workflows/);
# kept for the DigitalOcean -> AWS cutover transition. Do not modernize or
# wire this file up; the active workflow is .github/workflows/deploy.yml.
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      deployment_type:
        description: 'Type of deployment'
        required: true
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - canary
          - rolling
  push:
    branches: [ main ]
    paths:
      - 'deployment/helm/rag-system/**'
      - 'deployment/kubernetes/**'
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  # TODO(cutover): VAULT_TOKEN is a DigitalOcean-era secret still required by
  # the backend during the DO->AWS transition; remove once Vault is migrated.
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  prepare-deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      deployment-type: ${{ steps.vars.outputs.deployment-type }}
      image-tag: ${{ steps.vars.outputs.image-tag }}
      version: ${{ steps.vars.outputs.version }}
      timestamp: ${{ steps.vars.outputs.timestamp }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up deployment variables
      id: vars
      run: |
        echo "environment=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_OUTPUT
        echo "deployment-type=${{ github.event.inputs.deployment-type || 'blue-green' }}" >> $GITHUB_OUTPUT
        echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
        echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

    - name: Create deployment manifest
      run: |
        mkdir -p ./deployment-manifests
        cat > ./deployment-manifests/deployment-config.yaml << EOF
        deployment:
          environment: ${{ steps.vars.outputs.environment }}
          type: ${{ steps.vars.outputs.deployment-type }}
          version: ${{ steps.vars.outputs.version }}
          timestamp: ${{ steps.vars.outputs.timestamp }}
          image-tag: ${{ steps.vars.outputs.image-tag }}
          namespace: rag-system-${{ steps.vars.outputs.environment }}
        EOF

    - name: Upload deployment manifest
      uses: actions/upload-artifact@v3
      with:
        name: deployment-manifest
        path: ./deployment-manifests/
        retention-days: 7

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: prepare-deployment

    steps:
    - name: Download deployment manifest
      uses: actions/download-artifact@v3
      with:
        name: deployment-manifest

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Install kubeval
      run: |
        curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
        sudo mv kubeval /usr/local/bin/

    - name: Validate manifests with kubeval
      run: |
        kubeval -d deployment/kubernetes/ --strict

    - name: Validate Helm chart
      run: |
        helm lint deployment/helm/rag-system/

    - name: Create test namespace
      run: |
        kubectl create namespace rag-system-validation --dry-run=client -o yaml | kubectl apply -f -

    - name: Dry-run deployment
      run: |
        helm template ./deployment/helm/rag-system/ --name-template rag-system-dry-run \
          --namespace rag-system-validation \
          --set backend.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set ui.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set apiServer.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set ingestionService.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} | kubectl apply -f -

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [prepare-deployment, validate-manifests]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2

    steps:
    - name: Download deployment manifest
      uses: actions/download-artifact@v3
      with:
        name: deployment-manifest

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.6.0'

    - name: Terraform init
      run: |
        cd terraform/
        terraform init

    - name: Terraform plan
      run: |
        cd terraform/
        terraform plan -out=tfplan -var="environment=${{ needs.prepare-deployment.outputs.environment }}" \
          -var="version=${{ needs.prepare-deployment.outputs.version }}" \
          -var="image_tag=${{ needs.prepare-deployment.outputs.image-tag }}"

    - name: Terraform apply
      run: |
        cd terraform/
        terraform apply tfplan

    - name: Export infrastructure outputs
      run: |
        cd terraform/
        echo "KUBE_CONFIG=$(terraform output -raw kube_config)" >> $GITHUB_ENV
        echo "EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)" >> $GITHUB_ENV
        echo "VPC_ID=$(terraform output -raw vpc_id)" >> $GITHUB_ENV

  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [prepare-deployment, validate-manifests, deploy-infrastructure]
    environment: ${{ needs.prepare-deployment.outputs.environment }}

    steps:
    - name: Download deployment manifest
      uses: actions/download-artifact@v3
      with:
        name: deployment-manifest

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Configure kubectl
      run: |
        echo "${{ env.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context ${{ env.EKS_CLUSTER_NAME }}

    - name: Create namespace
      run: |
        kubectl create namespace rag-system-${{ needs.prepare-deployment.outputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Install Cert-Manager
      run: |
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
        helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true

    - name: Deploy monitoring stack
      run: |
        helm install prometheus prometheus-community/kube-prometheus-stack \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }}-monitoring \
          --create-namespace \
          --set grafana.adminPassword=admin123

    - name: Deploy logging stack
      run: |
        helm install elasticsearch elastic/elasticsearch \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }}-logging \
          --create-namespace \
          --set replicas=3
        helm install kibana elastic/kibana \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }}-logging \
          --set elasticsearch.hosts=http://elasticsearch:9200

    - name: Deploy secrets
      run: |
        # TODO(cutover): do-api-token / do-kb-* are DigitalOcean secrets still
        # consumed by the backend during the DO->AWS transition; remove once
        # the Knowledge Base integration is replaced on AWS.
        kubectl create secret generic rag-secrets \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }} \
          --from-literal=neo4j-uri=bolt://neo4j:7687 \
          --from-literal=neo4j-username=neo4j \
          --from-literal=neo4j-password=${{ secrets.NEO4J_PASSWORD }} \
          --from-literal=do-api-token=${{ secrets.DO_API_TOKEN }} \
          --from-literal=do-kb-project-id=${{ secrets.DO_KB_PROJECT_ID }} \
          --from-literal=do-kb-embedding-model-uuid=${{ secrets.DO_KB_EMBEDDING_MODEL_UUID }} \
          --from-literal=redis-url=redis://redis:6379 \
          --from-literal=redis-password=${{ secrets.REDIS_PASSWORD }} \
          --from-literal=openai-api-key=${{ secrets.OPENAI_API_KEY }} \
          --from-literal=anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }} \
          --from-literal=backend-secret-key=${{ secrets.BACKEND_SECRET_KEY }} \
          --from-literal=grafana-admin-password=${{ secrets.GRAFANA_PASSWORD }}

    - name: Deploy main application
      run: |
        helm upgrade --install rag-system ./deployment/helm/rag-system/ \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }} \
          --set backend.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set ui.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set apiServer.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set ingestionService.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set environment=${{ needs.prepare-deployment.outputs.environment }} \
          --set deployment.type=${{ needs.prepare-deployment.outputs.deployment-type }}

    - name: Wait for pods to be ready
      run: |
        kubectl wait --for=condition=ready pod -l app=rag-backend -n rag-system-${{ needs.prepare-deployment.outputs.environment }} --timeout=300s
        kubectl wait --for=condition=ready pod -l app=rag-ui -n rag-system-${{ needs.prepare-deployment.outputs.environment }} --timeout=300s
        kubectl wait --for=condition=ready pod -l app=rag-api-server -n rag-system-${{ needs.prepare-deployment.outputs.environment }} --timeout=300s
        kubectl wait --for=condition=ready pod -l app=rag-ingestion-service -n rag-system-${{ needs.prepare-deployment.outputs.environment }} --timeout=300s

  run-smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [prepare-deployment, deploy-kubernetes]
    environment: ${{ needs.prepare-deployment.outputs.environment }}

    steps:
    - name: Download deployment manifest
      uses: actions/download-artifact@v3
      with:
        name: deployment-manifest

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        echo "${{ env.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context ${{ env.EKS_CLUSTER_NAME }}

    - name: Install dependencies
      run: |
        pip install requests pytest httpx

    - name: Run smoke tests
      run: |
        python scripts/smoke-tests.py \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }} \
          --url https://api.rag-system-${{ needs.prepare-deployment.outputs.environment }}.${{ needs.prepare-deployment.outputs.environment }}.example.com

  validate-health:
    name: Validate Health and Performance
    runs-on: ubuntu-latest
    needs: [prepare-deployment, deploy-kubernetes, run-smoke-tests]
    environment: ${{ needs.prepare-deployment.outputs.environment }}

    steps:
    - name: Download deployment manifest
      uses: actions/download-artifact@v3
      with:
        name: deployment-manifest

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        echo "${{ env.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context ${{ env.EKS_CLUSTER_NAME }}

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Deploy monitoring stack
      run: |
        helm install prometheus prometheus-community/kube-prometheus-stack \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }}-monitoring \
          --create-namespace \
          --set grafana.adminPassword=admin123

    - name: Wait for monitoring stack
      run: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=prometheus -n rag-system-${{ needs.prepare-deployment.outputs.environment }}-monitoring --timeout=300s

    - name: Run health checks
      run: |
        python scripts/health-checks.py \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }} \
          --prometheus-url http://prometheus:9090

    - name: Run performance tests
      run: |
        python scripts/performance-tests.py \
          --namespace rag-system-${{ needs.prepare-deployment.outputs.environment }} \
          --concurrent-users 50 \
          --duration 300

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [prepare-deployment, validate-manifests, deploy-infrastructure, deploy-kubernetes, run-smoke-tests, validate-health]

    steps:
    - name: Upload deployment summary
      uses: actions/upload-artifact@v3
      with:
        name: deployment-summary-${{ needs.prepare-deployment.outputs.environment }}
        path: |
          ./deployment-manifests/deployment-config.yaml
        retention-days: 30

    - name: Notify Slack
      if: always()
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Deployment ${{ needs.prepare-deployment.outputs.environment }} completed. Status: ${{ job.status }}\"}" \
          ${{ env.SLACK_WEBHOOK }}

    - name: Cleanup temporary files
      if: always()
      run: |
        rm -rf ./deployment-manifests/
        rm -rf ./terraform/tfplan

  promote-to-prod:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [prepare-deployment, deploy-kubernetes, run-smoke-tests, validate-health]
    if: needs.prepare-deployment.outputs.environment == 'staging' && github.event_name == 'workflow_dispatch'
    environment: production

    steps:
    - name: Download deployment manifest
      uses: actions/download-artifact@v3
      with:
        name: deployment-manifest

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Configure kubectl
      run: |
        echo "${{ env.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context ${{ env.EKS_CLUSTER_NAME }}

    - name: Promote deployment
      run: |
        helm upgrade --install rag-system ./deployment/helm/rag-system/ \
          --namespace rag-system-production \
          --set backend.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set ui.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set apiServer.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set ingestionService.image.tag=${{ needs.prepare-deployment.outputs.image-tag }} \
          --set environment=production \
          --set deployment.type=production

    - name: Notify Slack
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Production deployment completed successfully!\"}" \
          ${{ env.SLACK_WEBHOOK }}