[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
norecursedirs = ["actions-runner", "node_modules", ".git", ".venv", "venv", "dist", "build"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "actions-runner",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    # Import ordering (handled by isort)
    "E402",   # Module level import not at top of file
    # Line length (handled by black)
    "E501",   # Line too long
    # Style preferences
    "E701",   # Multiple statements on one line
    "E712",   # Comparison to True/False
    "E722",   # Bare except
    "E741",   # Ambiguous variable name
    # Unused code (often intentional)
    "F401",   # Unused import
    "F403",   # Star import
    "F405",   # Name from star import
    "F541",   # f-string without placeholders
    "F811",   # Redefinition of unused name
    "F841",   # Local variable assigned but never used
]
# F821 (undefined name) and F823 (referenced before assignment) are
# deliberately NOT ignored: they are latent NameErrors, not style.

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"backend/src/tasks/*.py" = ["E402"]
"backend/src/websocket/*.py" = ["F401", "F841"]

[dependency-groups]
dev = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.3.1",
]
